<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>Suraksha Vigil Bot</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #d3d3d3; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-app { width: 380px; height: 650px; background: #efeae2; display: flex; flex-direction: column; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .lang-switch { background: #128c7e; border: none; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg { max-width: 80%; padding: 10px; margin: 5px 0; border-radius: 10px; font-size: 14px; position: relative; }
        .bot { background: #fff; align-self: flex-start; border-bottom-left-radius: 0; }
        .user { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
        .input-area { display: flex; padding: 10px; background: #f0f0f0; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 5px; background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
        .call-screen { position: absolute; width: 380px; height: 650px; background: #075e54; color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="header">
        <div><b>Suraksha Vigil</b></div>
        <button class="lang-switch" onclick="toggleLang()">EN/मराठी</button>
        <span onclick="startCall()" style="cursor:pointer; font-size: 20px;">📞</span>
    </div>
    <div class="chat-box" id="chat"></div>
    <div class="input-area">
        <input id="input" placeholder="Type message...">
        <button onclick="send()">➤</button>
        <button onclick="startVoice()">🎤</button>
    </div>
</div>

<div class="call-screen" id="callScreen">
    <h2 id="callStatus">📞 Call Active</h2>
    <button onclick="endCall()" style="width: auto; padding: 10px 20px; border-radius: 20px; margin-top: 20px;">End Call</button>
</div>

<script>
    let lang = 'mr'; 
    let step = 0;
    let mode = 'chat';
    let userData = {};

    const questions = {
        mr: [
            "नमस्कार, मी सुरक्षा विजील हेल्पलाईनमधून बोलत आहे. ADR रिपोर्टिंग सुरू करण्यासाठी 'हो' म्हणा.",
            "तुमचे पूर्ण नाव सांगा.",
            "रुग्णाचे वय सांगा.",
            "कोणत्या औषधामुळे त्रास झाला?",
            "तुम्हाला नेमका काय त्रास झाला?",
            "धन्यवाद! आपला रिपोर्ट सबमिट झाला आहे."
        ],
        en: [
            "Hello, I am from Suraksha Vigil helpline. Say 'Yes' to start ADR reporting.",
            "Please tell your full name.",
            "Please tell the patient's age.",
            "Which medicine caused the reaction?",
            "What exactly was the reaction?",
            "Thank you! Your report has been submitted."
        ]
    };

    function toggleLang() {
        lang = (lang === 'mr') ? 'en' : 'mr';
        alert("Language switched to: " + lang.toUpperCase());
    }

    function addMsg(text, type) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
        if (mode !== 'call') return;
        const s = new SpeechSynthesisUtterance(text);
        s.lang = (lang === 'mr') ? 'mr-IN' : 'en-US';
        speechSynthesis.speak(s);
        
        // After speaking, wait for user input automatically in Call Mode
        if (step < questions[lang].length - 1) {
            s.onend = () => setTimeout(startVoice, 1000);
        }
    }

    function validate(step, input) {
        // Smart Logic: Check if input is valid
        if (step === 0) return input.toLowerCase().includes('ho') || input.toLowerCase().includes('yes');
        if (step === 1) return input.length > 3; // Name must be > 3 chars
        if (step === 2) return !isNaN(input); // Age must be number
        return true;
    }

    function process(text) {
        if (validate(step, text)) {
            userData['step' + step] = text;
            step++;
            if (step < questions[lang].length) {
                let nextQ = questions[lang][step];
                addMsg(nextQ, "bot");
                speak(nextQ);
            } else {
                addMsg(questions[lang][step-1], "bot"); // Done msg
                // sendToSheet(userData); 
            }
        } else {
            // Error handling
            let errorMsg = (lang === 'mr') ? "माफ करा, कृपया पुन्हा स्पष्ट सांगा." : "Sorry, please provide a valid answer.";
            addMsg(errorMsg, "bot");
            speak(errorMsg);
            // Don't increment step, ask again
            setTimeout(() => {
                let retryQ = questions[lang][step];
                addMsg(retryQ, "bot");
                speak(retryQ);
            }, 2000);
        }
    }

    function send() {
        const input = document.getElementById("input");
        if (!input.value) return;
        addMsg(input.value, "user");
        process(input.value);
        input.value = "";
    }

    function startVoice() {
        const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        rec.lang = (lang === 'mr') ? 'mr-IN' : 'en-US';
        rec.start();
        rec.onresult = (e) => {
            const text = e.results[0][0].transcript;
            addMsg(text, "user");
            process(text);
        };
    }

    function startCall() {
        mode = 'call';
        document.getElementById("callScreen").style.display = "flex";
        step = 0;
        addMsg(questions[lang][0], "bot");
        speak(questions[lang][0]);
    }

    function endCall() {
        mode = 'chat';
        document.getElementById("callScreen").style.display = "none";
        speechSynthesis.cancel();
    }

    window.onload = () => {
        addMsg(questions[lang][0], "bot");
    };
</script>
</body>
</html>
