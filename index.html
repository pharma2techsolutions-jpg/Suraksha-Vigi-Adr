<!-- =========================
SURAKSHA VIGIL BOT - FINAL
========================= -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suraksha Vigil Bot</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b141a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:420px;
height:95vh;
background:#efeae2;
display:flex;
flex-direction:column;
overflow:hidden;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,.4);
position:relative;
}

.header{
background:#075e54;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
align-items:center;
}

.dp{
width:40px;
height:40px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
margin-right:10px;
font-size:20px;
}

.icons span{
margin-left:15px;
font-size:20px;
cursor:pointer;
}

.chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
background:#efeae2;
}

.msg{
max-width:78%;
padding:10px 12px;
margin:5px 0;
border-radius:10px;
font-size:14px;
line-height:1.5;
animation:fade .2s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(5px);}
to{opacity:1;transform:translateY(0);}
}

.bot{
background:white;
align-self:flex-start;
border-top-left-radius:0;
}

.user{
background:#d9fdd3;
align-self:flex-end;
border-top-right-radius:0;
}

.time{
font-size:10px;
color:gray;
text-align:right;
margin-top:4px;
}

.input-area{
display:flex;
padding:8px;
background:#f0f2f5;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
margin-left:5px;
border:none;
border-radius:50%;
width:42px;
height:42px;
cursor:pointer;
background:#075e54;
color:white;
font-size:18px;
}

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:8px 0;
}

.chip{
background:#128c7e;
color:white;
border:none;
padding:10px 14px;
border-radius:20px;
cursor:pointer;
font-size:13px;
width:auto;
height:auto;
}

.call-screen{
position:absolute;
inset:0;
background:#075e54;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
padding:20px;
z-index:999;
}

.call-avatar{
width:120px;
height:120px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
margin-bottom:20px;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.calling{
font-size:20px;
margin-bottom:10px;
}

.ringing{
font-size:14px;
opacity:.8;
}

.end{
margin-top:30px;
width:auto;
border-radius:20px;
padding:10px 25px;
background:red;
font-size:16px;
}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<div class="left">

<div class="dp">🛡️</div>

<div>
<b>Suraksha Vigil Bot</b><br>
<small>online</small>
</div>

</div>

<div class="icons">
<span onclick="startCall()">📞</span>
</div>

</div>

<!-- CHAT -->

<div class="chat" id="chat"></div>

<!-- INPUT -->

<div class="input-area">

<input id="input" placeholder="Type message...">

<button onclick="send()">➤</button>

<button onclick="voiceInput()">🎤</button>

</div>

<!-- CALL -->

<div class="call-screen" id="callScreen">

<div class="call-avatar">🛡️</div>

<div class="calling">Suraksha Vigil Helpline</div>

<div class="ringing">Voice Assistant Active...</div>

<button class="end" onclick="endCall()">End Call</button>

</div>

</div>

<script>

let lang="";
let step=0;
let data={};

const chat=document.getElementById("chat");

/* QUESTIONS */

const mrQuestions=[

{q:"तुम्ही ही माहिती कोण म्हणून भरत आहात?",chips:["रुग्ण","डॉक्टर","फार्मासिस्ट","विद्यार्थी"]},

{q:"तुमचे गाव किंवा शहर कोणते? 📍"},

{q:"रुग्णाचे नाव काय आहे?"},

{q:"रुग्णाचे वय किती आहे?"},

{q:"लिंग निवडा:",chips:["पुरुष","महिला"]},

{q:"कोणत्या प्रकारचे औषध होते?",chips:["गोळी","सिरप","इंजेक्शन","क्रीम"]},

{q:"औषधाचे नाव काय होते?"},

{q:"काय त्रास झाला?",chips:["चक्कर 😵","खाज 😣","ताप 🤒","मळमळ 🤮"]},

{q:"हा त्रास कधी सुरू झाला?"},

{q:"त्रास किती गंभीर होता?",chips:["सौम्य","मध्यम","गंभीर"]},

{q:"हॉस्पिटलला जावे लागले का?",chips:["हो","नाही"]}

];

const enQuestions=[

{q:"Who are you reporting as?",chips:["Patient","Doctor","Pharmacist","Student"]},

{q:"Which city or village are you from? 📍"},

{q:"What is the patient name?"},

{q:"What is the patient age?"},

{q:"Select gender:",chips:["Male","Female"]},

{q:"What type of medicine was it?",chips:["Tablet","Syrup","Injection","Cream"]},

{q:"What was the medicine name?"},

{q:"What side effect happened?",chips:["Dizziness 😵","Itching 😣","Fever 🤒","Nausea 🤮"]},

{q:"When did it start?"},

{q:"How severe was it?",chips:["Mild","Moderate","Severe"]},

{q:"Was hospital visit needed?",chips:["Yes","No"]}

];

/* MESSAGE */

function addMsg(msg,type){

let d=document.createElement("div");

d.className="msg "+type;

d.innerHTML=msg+`<div class='time'>${new Date().toLocaleTimeString()}</div>`;

chat.appendChild(d);

chat.scrollTop=chat.scrollHeight;

}

/* SPEAK */

function speak(t){

speechSynthesis.cancel();

let s=new SpeechSynthesisUtterance(t);

s.lang=lang==="en" ? "en-US" : "mr-IN";

speechSynthesis.speak(s);

}

/* WELCOME */

window.onload=()=>{

addMsg(`
<b>🛡️ Welcome to Suraksha Vigil Bot</b><br><br>

💊 Smart ADR Reporting & Drug Safety Awareness Assistant.<br><br>

👉 कृपया भाषा निवडा / Please choose language.
`,"bot");

showLangButtons();

};

/* LANGUAGE BUTTONS */

function showLangButtons(){

let wrap=document.createElement("div");

wrap.className="chips";

let mr=document.createElement("button");

mr.className="chip";

mr.innerText="🇮🇳 मराठी";

mr.onclick=()=>{

lang="mr";

addMsg("🇮🇳 मराठी निवडली","user");

startChat();

};

let en=document.createElement("button");

en.className="chip";

en.innerText="🇬🇧 English";

en.onclick=()=>{

lang="en";

addMsg("🇬🇧 English Selected","user");

startChat();

};

wrap.appendChild(mr);

wrap.appendChild(en);

chat.appendChild(wrap);

}

/* START CHAT */

function startChat(){

if(lang==="mr"){

addMsg(`
🙏 नमस्कार!<br><br>

मी तुमची ADR Reporting मध्ये मदत करेन.<br><br>

📌 कृपया खालील माहिती द्या.
`,"bot");

}

else{

addMsg(`
🙏 Hello!<br><br>

I will help you with ADR Reporting.<br><br>

📌 Please provide the following details.
`,"bot");

}

step=0;

setTimeout(()=>{

askQuestion();

},700);

}

/* ASK */

function askQuestion(){

let qs=lang==="mr" ? mrQuestions : enQuestions;

if(step<qs.length){

addMsg(qs[step].q,"bot");

if(qs[step].chips){

showChips(qs[step].chips);

}

}

else{

addMsg(

lang==="mr"

?

"✅ तुमचा ADR Report यशस्वीरित्या नोंदवला गेला आहे.<br><br>🙏 औषध सुरक्षिततेसाठी तुमचे योगदान महत्त्वाचे आहे."

:

"✅ Your ADR Report has been submitted successfully.<br><br>🙏 Your contribution helps improve medicine safety."

,"bot");

sendToSheet(data);

}

}

/* CHIPS */

function showChips(arr){

let wrap=document.createElement("div");

wrap.className="chips";

arr.forEach(x=>{

let b=document.createElement("button");

b.className="chip";

b.innerText=x;

b.onclick=()=>handleInput(x);

wrap.appendChild(b);

});

chat.appendChild(wrap);

}

/* HANDLE */

function handleInput(v){

addMsg(v,"user");

data["Q"+step]=v;

step++;

askQuestion();

}

/* SEND */

function send(){

let v=input.value.trim();

if(!v)return;

handleInput(v);

input.value="";

}

/* VOICE INPUT */

function voiceInput(){

let r=new webkitSpeechRecognition();

r.lang=lang==="en" ? "en-IN" : "mr-IN";

r.start();

r.onresult=e=>{

let t=e.results[0][0].transcript;

handleInput(t);

};

}

/* CALL */

function startCall(){

document.getElementById("callScreen").style.display="flex";

let msg="नमस्कार. Suraksha Vigil Helpline मध्ये तुमचे स्वागत आहे. ADR म्हणजे औषध घेतल्यानंतर होणारा दुष्परिणाम. Drug Drug Interaction म्हणजे दोन औषधे एकत्र घेतल्यामुळे होणारा परिणाम. औषधे डॉक्टरांच्या सल्ल्यानेच घ्यावीत. ADR reporting मुळे रुग्णांची सुरक्षितता वाढते.";

speak(msg);

}

/* END */

function endCall(){

speechSynthesis.cancel();

document.getElementById("callScreen").style.display="none";

}

/* SHEET */

function sendToSheet(data){

fetch("YOUR_GOOGLE_SCRIPT_URL",{

method:"POST",

body:JSON.stringify(data)

});

}

</script>

</body>
</html>
