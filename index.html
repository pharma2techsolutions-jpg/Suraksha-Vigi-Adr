<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suraksha Vigil AI | WhatsApp Pro</title>
    <style>
        :root { --wa-dark: #0b141a; --wa-green: #25d366; --wa-teal: #075e54; --wa-bg: #efeae2; --wa-msg-in: #ffffff; --wa-msg-out: #e7ffdb; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Helvetica, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; background: #d1d7db; overflow: hidden; }

        /* WhatsApp Voice Call Interface */
        #callOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--wa-dark); z-index: 5000; display: none;
            flex-direction: column; align-items: center; justify-content: space-between;
            color: white; padding: 60px 20px;
        }
        .caller-avatar { width: 130px; height: 130px; border-radius: 50%; background: #505c64; display: flex; align-items: center; justify-content: center; font-size: 65px; border: 2px solid rgba(255,255,255,0.2); position: relative; }
        .pulse { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--wa-green); animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
        
        .status-text { color: var(--wa-green); font-weight: bold; letter-spacing: 1px; margin-top: 15px; }
        .ai-text-display { width: 85%; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 15px; text-align: center; font-size: 17px; min-height: 80px; }

        .dial-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .key { width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }

        /* WhatsApp Chat Interface */
        .app-container { width: 100%; max-width: 500px; height: 100dvh; background: var(--wa-bg); margin: auto; display: flex; flex-direction: column; position: relative; }
        .header { background: var(--wa-teal); color: white; padding: 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header img { width: 40px; height: 40px; border-radius: 50%; background: white; }
        
        .chat-window { flex: 1; overflow-y: auto; padding: 15px; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; }
        .bubble { padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; max-width: 85%; font-size: 15px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .bot { background: var(--wa-msg-in); align-self: flex-start; border-top-left-radius: 0; }
        .user { background: var(--wa-msg-out); align-self: flex-end; border-top-right-radius: 0; }

        .input-area { background: #f0f0f0; padding: 8px; display: flex; align-items: center; gap: 8px; }
        .input-box { flex: 1; background: white; border-radius: 25px; padding: 10px 15px; border: none; outline: none; }
        .mic-btn { background: var(--wa-teal); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .recording { background: #ff3b30 !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Voice Call Screen -->
    <div id="callOverlay">
        <div class="caller-profile">
            <center>
                <div class="caller-avatar"><div class="pulse"></div>🛡️</div>
                <h2>Suraksha Vigil AI</h2>
                <div class="status-text" id="callStatus">WhatsApp Audio Call...</div>
            </center>
        </div>

        <div class="ai-text-display" id="aiTalk">कॉल जोडला जात आहे...</div>

        <div class="dial-pad">
            <div class="key" onclick="pressKey('1')">1</div>
            <div class="key" onclick="pressKey('2')">2</div>
            <div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div>
        </div>

        <button onclick="endCall()" style="background:#ff3b30; border:none; width:65px; height:65px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
        </button>
    </div>

    <!-- Main Chat Header -->
    <div class="header">
        <div style="font-size: 20px;">←</div>
        <div style="background:white; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px;">🛡️</div>
        <div style="flex:1;"><b>Suraksha Vigil AI</b><br><small>Online</small></div>
        <div onclick="startCall()" style="cursor:pointer; font-size:22px;">📞</div>
    </div>

    <div class="chat-window" id="chat">
        <div class="bubble bot">नमस्कार! मी सुरक्षा विजिल AI आहे. औषध दुष्परिणामांची नोंद करण्यासाठी वर दिलेल्या कॉल बटणावर क्लिक करा किंवा येथे मेसेज करा.</div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" class="input-box" placeholder="मेसेज टाईप करा...">
        <button id="micBtn" class="mic-btn" onclick="toggleSpeech()">🎤</button>
    </div>
</div>

<audio id="ringtone" src="https://www.soundjay.com/phone/phone-calling-1.mp3" loop></audio>

<script>
    let step = -1;
    let reportData = {};
    const questions = [
        "तुमची ओळख काय आहे? (उदा. रुग्ण किंवा डॉक्टर)", "तुमचे शहर सांगा.", "रुग्णाचे नाव काय आहे?", 
        "वय किती आहे?", "लिंग सांगा.", "औषधाचे नाव काय?", "काय त्रास झाला?", "त्रास किती गंभीर होता?"
    ];

    const ring = document.getElementById("ringtone");
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'mr-IN';

    function speak(text, callback) {
        window.speechSynthesis.cancel();
        let m = new SpeechSynthesisUtterance(text);
        m.lang = 'mr-IN'; m.rate = 0.95; m.volume = 1; m.pitch = 1;
        document.getElementById("aiTalk").innerText = text;
        m.onend = () => { if(callback) callback(); };
        window.speechSynthesis.speak(m);
    }

    function startCall() {
        document.getElementById("callOverlay").style.display = "flex";
        speak("सुरक्षा विजिल हेल्पलाइनमध्ये आपले स्वागत आहे. माहितीसाठी १, २ किंवा ३ दाबा. ADR रिपोर्टिंगसाठी ४ दाबा.");
    }

    function pressKey(n) {
        if(n === '1') speak("ए डी आर रिपोर्टिंगमुळे आपण औषधांना अधिक सुरक्षित बनवू शकतो.");
        if(n === '2') speak("रिपोर्ट केल्यामुळे भविष्यातील धोके टाळता येतात.");
        if(n === '3') speak("हा प्रकल्प डॉक्टर भूषण पवार सर यांच्या मार्गदर्शनाखाली तयार करण्यात आला आहे. त्यांचे मार्गदर्शन औषध सुरक्षेसाठी अत्यंत मोलाचे आहे.");
        if(n === '4') {
            ring.play();
            document.getElementById("callStatus").innerText = "CONNECTING...";
            speak("तुमचा कॉल कनेक्ट केला जात आहे, कृपया ओळीवर रहा...", () => {
                ring.pause();
                document.getElementById("callOverlay").style.display = "none";
                startReporting();
            });
        }
    }

    function startReporting() {
        step = 0;
        botMsg(questions[step]);
        speak(questions[step]);
    }

    function toggleSpeech() {
        const btn = document.getElementById("micBtn");
        if(btn.classList.contains("recording")) {
            recognition.stop();
            btn.classList.remove("recording");
        } else {
            recognition.start();
            btn.classList.add("recording");
        }
    }

    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById("msgInput").value = text;
        processInput(text);
        document.getElementById("micBtn").classList.remove("recording");
    };

    function processInput(text) {
        userMsg(text);
        reportData["Q" + step] = text;
        step++;
        if(step < questions.length) {
            setTimeout(() => {
                botMsg(questions[step]);
                speak(questions[step]);
            }, 800);
        } else {
            let fin = "धन्यवाद! तुमची माहिती सुरक्षितपणे नोंदवण्यात आली आहे.";
            botMsg(fin); speak(fin);
            sendToSheet();
        }
    }

    function botMsg(t) {
        let d = document.createElement("div"); d.className = "bubble bot"; d.innerText = t;
        document.getElementById("chat").appendChild(d); scroll();
    }
    function userMsg(t) {
        let d = document.createElement("div"); d.className = "bubble user"; d.innerText = t;
        document.getElementById("chat").appendChild(d); scroll();
    }
    function scroll() { let c = document.getElementById("chat"); c.scrollTop = c.scrollHeight; }
    function endCall() { document.getElementById("callOverlay").style.display = "none"; window.speechSynthesis.cancel(); ring.pause(); }

    function sendToSheet() {
        fetch("YOUR_APPS_SCRIPT_URL", {
            method: "POST", mode: "no-cors", body: JSON.stringify(reportData)
        });
    }
</script>

</body>
</html>
