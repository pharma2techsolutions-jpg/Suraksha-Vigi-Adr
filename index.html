<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Suraksha Vigil Bot</title>

<style>
/* CSS आधीप्रमाणेच कायम ठेवला आहे */
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#0b141a; }
.app{ width:100%; max-width:430px; height:100dvh; margin:auto; background:#efeae2; display:flex; flex-direction:column; overflow:hidden; position:relative; }
.header{ background:#075e54; color:white; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; z-index:10; }
.left{ display:flex; align-items:center; }
.dp{ width:42px; height:42px; border-radius:50%; background:white; display:flex; justify-content:center; align-items:center; margin-right:10px; font-size:22px; }
.head-text small{ opacity:.8; font-size:12px; }
.helpline-btn{ display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.15); padding:8px 14px; border-radius:20px; cursor:pointer; font-size:14px; transition:.2s; }
.chat{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; background:#e5ddd5; scroll-behavior:smooth; }
.msg{ max-width:78%; padding:10px 13px; margin:5px 0; border-radius:12px; font-size:14px; line-height:1.5; animation:fade .2s ease; position:relative; box-shadow:0 1px 2px rgba(0,0,0,.08); }
@keyframes fade{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:translateY(0); } }
.bot{ background:white; align-self:flex-start; border-top-left-radius:0; }
.user{ background:#d9fdd3; align-self:flex-end; border-top-right-radius:0; }
.time{ font-size:10px; color:gray; margin-top:4px; text-align:right; }
.input-area{ display:flex; align-items:center; padding:10px; gap:8px; background:#f0f2f5; border-top:1px solid #ddd; flex-shrink:0; }
.input-box{ flex:1; display:flex; align-items:center; background:white; border-radius:30px; padding:0 12px; min-height:48px; }
.input-box input{ flex:1; padding:13px 6px; border:none; outline:none; font-size:16px; background:transparent; }
.send, .mic{ width:48px; height:48px; border:none; border-radius:50%; background:#075e54; color:white; font-size:18px; cursor:pointer; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
.chip{ background:#128c7e; color:white; border:none; padding:10px 15px; border-radius:22px; font-size:13px; cursor:pointer; }
.call-screen{ position:absolute; inset:0; background:#075e54; display:none; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center; padding:20px; z-index:9999; }
.call-avatar{ width:120px; height:120px; border-radius:50%; background:white; display:flex; justify-content:center; align-items:center; font-size:55px; margin-bottom:20px; animation:pulse 1.5s infinite; }
@keyframes pulse{ 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }
.dialpad{ display:grid; grid-template-columns:repeat(3,80px); gap:15px; margin-top:35px; }
.dial-btn{ width:80px; height:80px; border-radius:50%; border:none; background:white; color:#075e54; font-size:28px; font-weight:bold; }
.end{ margin-top:40px; padding:12px 30px; border:none; border-radius:25px; background:red; color:white; cursor:pointer; }
@media(max-width:500px){ .app{ max-width:100%; height:100dvh; } .msg{ max-width:85%; } }
</style>
</head>

<body>

<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="left">
            <div class="dp">🛡️</div>
            <div class="head-text"><b>Suraksha Vigil Bot</b><br><small>online</small></div>
        </div>
        <div class="helpline-btn" onclick="startCall()">📞 Helpline</div>
    </div>

    <!-- CHAT -->
    <div class="chat" id="chat"></div>

    <!-- INPUT -->
    <div class="input-area">
        <div class="input-box">
            <input type="text" id="input" placeholder="Type message..." autocomplete="off"/>
        </div>
        <button class="send" onclick="send()">➤</button>
        <button class="mic" onclick="voiceInput()">🎤</button>
    </div>

    <!-- CALL SCREEN -->
    <div class="call-screen" id="callScreen">
        <div class="call-avatar">🛡️</div>
        <div class="call-title">Suraksha Vigil Helpline</div>
        <div class="call-info" id="callInfo">Connecting...</div>
        <div class="dialpad">
            <button class="dial-btn" onclick="dialOption(1)">1</button>
            <button class="dial-btn" onclick="dialOption(2)">2</button>
            <button class="dial-btn" onclick="dialOption(3)">3</button>
        </div>
        <button class="end" onclick="endCall()">End Call</button>
    </div>
</div>

<script>
let lang="";
let step=0;
let data={};
let chatStarted=false;
const chat=document.getElementById("chat");
const input=document.getElementById("input");

// --- FUNCTIONS ---

function scrollBottom(){ requestAnimationFrame(()=>{ chat.scrollTop=chat.scrollHeight; }); }

const mrQuestions=[
    {q:"तुम्ही ही माहिती कोण म्हणून भरत आहात?",chips:["रुग्ण","डॉक्टर","फार्मासिस्ट","विद्यार्थी"]},
    {q:"तुमचे गाव किंवा शहर कोणते? 📍"},
    {q:"रुग्णाचे नाव काय आहे?"},
    {q:"रुग्णाचे वय किती आहे?"},
    {q:"लिंग निवडा:",chips:["पुरुष","महिला"]},
    {q:"कोणत्या प्रकारचे औषध होते?",chips:["गोळी","सिरप","इंजेक्शन","क्रीम"]},
    {q:"औषधाचे नाव काय होते?"},
    {q:"काय त्रास झाला?",chips:["चक्कर 😵","खाज 😣","ताप 🤒","मळमळ 🤮"]},
    {q:"हा त्रास कधी सुरू झाला?"},
    {q:"त्रास किती गंभीर होता?",chips:["सौम्य","मध्यम","गंभीर"]},
    {q:"हॉस्पिटलला जावे लागले का?",chips:["हो","नाही"]}
];

const enQuestions=[
    {q:"Who are you reporting as?",chips:["Patient","Doctor","Pharmacist","Student"]},
    {q:"Which city or village are you from? 📍"},
    {q:"What is the patient name?"},
    {q:"What is the patient age?"},
    {q:"Select gender:",chips:["Male","Female"]},
    {q:"What type of medicine was it?",chips:["Tablet","Syrup","Injection","Cream"]},
    {q:"What was the medicine name?"},
    {q:"What side effect happened?",chips:["Dizziness 😵","Itching 😣","Fever 🤒","Nausea 🤮"]},
    {q:"When did it start?"},
    {q:"How severe was it?",chips:["Mild","Moderate","Severe"]},
    {q:"Was hospital visit needed?",chips:["Yes","No"]}
];

function addMsg(msg,type){
    let div=document.createElement("div");
    div.className="msg "+type;
    div.innerHTML=msg+`<div class="time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
    chat.appendChild(div);
    scrollBottom();
}

function speak(text){
    speechSynthesis.cancel();
    let speech=new SpeechSynthesisUtterance(text);
    speech.lang=lang==="en" ? "en-US" : "mr-IN";
    speechSynthesis.speak(speech);
}

window.onload=()=>{
    addMsg("<b>🛡️ Welcome to Suraksha Vigil Bot</b><br><br>💊 Smart ADR Reporting Assistant<br><br>👉 कृपया भाषा निवडा / Please choose language.","bot");
    showLanguageButtons();
};

function showLanguageButtons(){
    let wrap=document.createElement("div"); wrap.className="chips";
    let mr=document.createElement("button"); mr.className="chip"; mr.innerText="🇮🇳 मराठी";
    mr.onclick=()=>{ lang="mr"; addMsg("🇮🇳 मराठी निवडली","user"); startChat(); };
    let en=document.createElement("button"); en.className="chip"; en.innerText="🇬🇧 English";
    en.onclick=()=>{ lang="en"; addMsg("🇬🇧 English Selected","user"); startChat(); };
    wrap.appendChild(mr); wrap.appendChild(en);
    chat.appendChild(wrap); scrollBottom();
}

function startChat(){
    chatStarted=true; step=0; data={};
    let welcome = lang==="mr" ? "🙏 नमस्कार! मी तुमची ADR Reporting मध्ये मदत करेन." : "🙏 Hello! I will help you with ADR Reporting.";
    addMsg(welcome,"bot");
    setTimeout(askQuestion,700);
}

function askQuestion(){
    let qs=lang==="mr" ? mrQuestions : enQuestions;
    if(step<qs.length){
        addMsg(qs[step].q,"bot");
        if(qs[step].chips) showChips(qs[step].chips);
    } else {
        addMsg(lang==="mr" ? "✅ रिपोर्ट यशस्वीरित्या नोंदवला गेला आहे." : "✅ Report submitted successfully.","bot");
        sendToSheet(data);
    }
}

function showChips(arr){
    let wrap=document.createElement("div"); wrap.className="chips";
    arr.forEach(x=>{
        let b=document.createElement("button"); b.className="chip"; b.innerText=x;
        b.onclick=()=>handleInput(x); wrap.appendChild(b);
    });
    chat.appendChild(wrap); scrollBottom();
}

function handleInput(v){
    let qs=lang==="mr" ? mrQuestions : enQuestions;
    if(step>=qs.length) return;
    addMsg(v,"user");
    data["step_"+step]=v;
    step++;
    setTimeout(askQuestion,600);
}

function send(){
    if(!chatStarted) return;
    let val=input.value.trim();
    if(!val) return;
    handleInput(val);
    input.value="";
}

function voiceInput(){
    if(!chatStarted) return;
    let recog=new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recog.lang=lang==="en" ? "en-IN" : "mr-IN";
    recog.start();
    recog.onresult=(e)=>{ handleInput(e.results[0][0].transcript); };
}

// --- CALL HELPLINE ---

function startCall(){
    document.getElementById("callScreen").style.display="flex";
    document.getElementById("callInfo").innerHTML="1-ADR माहिती | 2-औषध परिणाम | 3-प्रोजेक्ट";
    speak("नमस्कार, सुरक्षा विजिल हेल्पलाइनमध्ये स्वागत आहे.");
}

function dialOption(n){
    let msg = n==1 ? "ADR म्हणजे औषधाचा दुष्परिणाम." : n==2 ? "दोन औषधे एकत्र घेतल्यास परिणाम होऊ शकतो." : "हा एक आधुनिक औषध सुरक्षा प्रकल्प आहे.";
    speak(msg);
}

function endCall(){ speechSynthesis.cancel(); document.getElementById("callScreen").style.display="none"; }

// --- DATA SUBMISSION ---

function sendToSheet(data){
    data.source="Chat Bot";
    // तुमची नवीन पब्लिश केलेली URL
    const scriptURL = "https://script.google.com/macros/s/AKfycbx0U0HNHQbqYnQAUYDwpkIHivnX--VkWPBzXovsPCtxrzCs4QM-eiqhU6HbrUzSer24fw/exec";

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(() => console.log("Data Sent!"))
    .catch(err => console.log("Error:", err));
}
</script>
</body>
</html>
