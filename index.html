<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suraksha Vigil AI</title>
    <style>
        :root { --whatsapp-teal: #075e54; --whatsapp-light: #dcf8c6; --bg-color: #efeae2; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; background: #ece5dd; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 500px; height: 100dvh; background: var(--bg-color); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        .header { background: var(--whatsapp-teal); color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; min-height: 65px; z-index: 10; }
        .bot-profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; }
        .chat-window { flex: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); display: flex; flex-direction: column; }
        .bubble { max-width: 85%; padding: 10px 14px; margin-bottom: 8px; border-radius: 12px; font-size: 15px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .bot-msg { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .user-msg { background: var(--whatsapp-light); align-self: flex-end; border-top-right-radius: 0; }
        .input-bar { padding: 10px; display: flex; align-items: center; gap: 8px; background: #f0f0f0; }
        .text-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
        .btn-round { width: 45px; height: 45px; background: var(--whatsapp-teal); color: white; border: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; }
        
        .call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #054d44; color: white; display: none; flex-direction: column; align-items: center; justify-content: space-around; z-index: 100; padding: 50px 20px; text-align: center; }
        .pulse-mic { width: 110px; height: 110px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 50px; }
        .active-mic { animation: pulse 1.2s infinite; background: rgba(255,255,255,0.2); }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); } 70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(255,255,255,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
        .end-btn { width: 65px; height: 65px; background: #ff3b30; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="bot-profile">
            <div class="avatar">🛡️</div>
            <div><b>Suraksha Vigil</b><br><small id="status">Online</small></div>
        </div>
        <div style="display:flex; gap:15px; font-size: 22px;">
            <span onclick="startCall()" style="cursor:pointer">📞</span>
            <span onclick="toggleLang()" style="cursor:pointer">🌐</span>
        </div>
    </div>

    <div class="chat-window" id="chat"></div>

    <div class="input-bar">
        <input type="text" id="userInput" class="text-input" placeholder="टाइप करा...">
        <button class="btn-round" onclick="handleSend()">➤</button>
        <button class="btn-round" onclick="startVoiceRecognition()">🎤</button>
    </div>

    <div class="call-overlay" id="callOverlay">
        <div>
            <div class="avatar" style="width:90px; height:90px; margin:0 auto 15px; font-size:45px;">🛡️</div>
            <h2>Suraksha Vigil</h2>
            <p id="call-subtitle">बॉट बोलत आहे...</p>
        </div>
        <div class="pulse-mic" id="mic-ui">🎙️</div>
        <button class="end-btn" onclick="endCall()">✖</button>
    </div>
</div>

<audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<script>
    let currentLang = 'mr';
    let step = 0;
    let isCallMode = false;
    let isFinished = false;
    let recognition;

    const script = {
        mr: [
            "नमस्कार, मी सुरक्षा विजील हेल्पलाईनमधून बोलत आहे. मला ADR रिपोर्टिंग करायची आहे.",
            "तुमचे पूर्ण नाव सांगा.",
            "रुग्णाचे वय किती सांगा?",
            "कोणत्या औषधामुळे त्रास झाला?",
            "नेमका काय त्रास झाला?",
            "हा त्रास कधी झाला?",
            "धन्यवाद! तुमचा रिपोर्ट नोंदवण्यात आला आहे. आम्ही लवकरच संपर्क करू."
        ],
        en: [
            "Hello, this is Suraksha Vigil helpline. I want to do ADR reporting.",
            "Please tell me your full name.",
            "What is the patient's age?",
            "Which medicine caused the reaction?",
            "What was the reaction?",
            "When did this happen?",
            "Thank you! Your report has been recorded. We will contact you soon."
        ]
    };

    function addBubble(text, sender) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `bubble ${sender}-msg`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function botSpeak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = currentLang === 'mr' ? 'mr-IN' : 'en-US';
        
        msg.onstart = () => {
            if(isCallMode) document.getElementById('call-subtitle').innerText = "बॉट बोलत आहे...";
        };

        msg.onend = () => {
            if(isCallMode && !isFinished) {
                setTimeout(startVoiceRecognition, 400);
            }
        };
        window.speechSynthesis.speak(msg);
    }

    function processInput(input) {
        if (isFinished) {
            let msg = currentLang === 'mr' ? "रिपोर्ट आधीच जमा झाला आहे." : "Report already submitted.";
            addBubble(msg, 'bot');
            if(isCallMode) botSpeak(msg);
            return;
        }

        step++;
        if (step < script[currentLang].length) {
            setTimeout(() => {
                const nextQ = script[currentLang][step];
                addBubble(nextQ, 'bot');
                if (isCallMode) botSpeak(nextQ);
                if (step === script[currentLang].length - 1) {
                    isFinished = true;
                    document.getElementById('successSound').play();
                }
            }, 700);
        }
    }

    function handleSend() {
        const input = document.getElementById('userInput');
        if (!input.value.trim()) return;
        addBubble(input.value, 'user');
        processInput(input.value);
        input.value = "";
    }

    function startVoiceRecognition() {
        const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
        if (!Speech) return;

        recognition = new Speech();
        recognition.lang = currentLang === 'mr' ? 'mr-IN' : 'en-US';
        recognition.interimResults = false;
        recognition.continuous = false; // अचूकतेसाठी false ठेवणे चांगले

        recognition.onstart = () => {
            document.getElementById('mic-ui').classList.add('active-mic');
            if(isCallMode) document.getElementById('call-subtitle').innerText = "मी ऐकत आहे, बोला...";
        };

        recognition.onresult = (e) => {
            const result = e.results[0][0].transcript;
            if(result.trim().length > 0) {
                addBubble(result, 'user');
                processInput(result);
            }
        };

        recognition.onend = () => {
            document.getElementById('mic-ui').classList.remove('active-mic');
            // जर बोलणे पूर्ण झाले नसेल आणि कॉल मोड चालू असेल तर पुन्हा सुरू करा
            if(isCallMode && !isFinished) {
                // recognition.start(); // Auto-restart can be tricky, handled by botSpeak.onend
            }
        };

        recognition.start();
    }

    function startCall() {
        isCallMode = true;
        document.getElementById('callOverlay').style.display = "flex";
        if (step === 0) {
            addBubble(script[currentLang][0], 'bot');
            botSpeak(script[currentLang][0]);
        }
    }

    function endCall() {
        isCallMode = false;
        document.getElementById('callOverlay').style.display = "none";
        window.speechSynthesis.cancel();
        if(recognition) recognition.stop();
    }

    function toggleLang() {
        currentLang = (currentLang === 'mr') ? 'en' : 'mr';
        alert("Language: " + currentLang.toUpperCase());
    }

    window.onload = () => { addBubble(script[currentLang][0], 'bot'); };
</script>
</body>
</html>
