<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suraksha Vigil AI | Professional</title>
    <style>
        :root { --wa-teal: #075e54; --wa-light: #dcf8c6; --wa-bg: #efeae2; --wa-header: #075e54; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #d1d7db; display: flex; justify-content: center; overflow: hidden; }
        .app-container { width: 100%; max-width: 500px; height: 100dvh; background: var(--wa-bg); display: flex; flex-direction: column; position: relative; }
        .header { background: var(--wa-header); color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 60px; z-index: 100; flex-shrink: 0; }
        .bot-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; scroll-behavior: smooth; }
        .bubble { max-width: 85%; padding: 10px 14px; margin-bottom: 10px; border-radius: 12px; font-size: 15px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; white-space: pre-line; }
        .bot { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .user { background: var(--wa-light); align-self: flex-end; border-top-right-radius: 0; }
        .chip-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .chip { background: #fff; border: 1px solid var(--wa-teal); color: var(--wa-teal); padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .input-bar { padding: 10px 15px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; min-height: 65px; flex-shrink: 0; }
        .text-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; outline: none; font-size: 16px; background: #fff; }
        .send-btn { width: 50px; height: 50px; background: var(--wa-teal); color: white; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .send-btn svg { width: 24px; height: 24px; fill: white; margin-left: 3px; }
    </style>
</head>
<body>

<div class="app-container" id="mainContainer">
    <div class="header">
        <div class="bot-info">
            <div class="avatar">🛡️</div>
            <div><b>Suraksha Vigil</b><br><small>Online</small></div>
        </div>
    </div>

    <div class="chat-window" id="chat">
        <div class="bubble bot">
            नमस्कार 👋 भाषा निवडा / Choose Language:
            <div class="chip-group" id="langChips">
                <div class="chip" onclick="setLang('mr')">मराठी</div>
                <div class="chip" onclick="setLang('en')">English</div>
            </div>
        </div>
    </div>

    <div class="input-bar" id="inputBar" style="display:none;">
        <input type="text" id="userInput" class="text-input" placeholder="टाईप करा..." onkeypress="if(event.key==='Enter') send()">
        <button class="send-btn" onclick="send()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>
</div>

<script>
let step = 0;
let reportData = {};
let lang = "mr";

const questions = {
    mr: [
        { q: "तुम्ही कोण आहात?", chips: ["रुग्ण (Patient)", "डॉक्टर", "फार्मासिस्ट", "विद्यार्थी"] },
        { q: "तुमचे शहर किंवा गाव कोणते? 📍" },
        { q: "रुग्णाचे नाव सांगा." },
        { q: "वय किती आहे?" },
        { q: "रुग्ण कोण आहे?", chips: ["पुरुष (Male)", "महिला (Female)"] },
        { q: "औषधाचा प्रकार काय होता?", chips: ["गोळी (Tablet)", "इंजेक्शन", "क्रीम", "सिरप"] },
        { q: "औषधाचे नाव सांगा? 💊" },
        { q: "नेमका काय त्रास झाला?" },
        { q: "त्रास कधी सुरू झाला?" },
        { q: "त्रास किती गंभीर होता?", chips: ["सौम्य", "मध्यम", "गंभीर"] },
        { q: "हॉस्पिटलला जावे लागले का?", chips: ["हो", "नाही"] }
    ],
    en: [
        { q: "Who are you?", chips: ["Patient", "Doctor", "Pharmacist", "Student"] },
        { q: "What is your city? 📍" },
        { q: "Patient name?" },
        { q: "Patient age?" },
        { q: "Gender?", chips: ["Male", "Female"] },
        { q: "Medicine type?", chips: ["Tablet", "Injection", "Cream", "Syrup"] },
        { q: "Medicine name? 💊" },
        { q: "Side effect noticed?" },
        { q: "When did it start?" },
        { q: "Severity?", chips: ["Mild", "Moderate", "Severe"] },
        { q: "Hospitalization required?", chips: ["Yes", "No"] }
    ]
};

function setLang(l) {
    lang = l;
    document.getElementById('langChips').style.display = 'none';
    document.getElementById('inputBar').style.display = 'flex';
    userMsg(l === 'mr' ? 'मराठी' : 'English');
    step = 0;
    askQ();
}

function askQ() {
    let qList = questions[lang];
    if (step < qList.length) {
        let cur = qList[step];
        botMsg(cur.q);
        if (cur.chips) {
            let grp = document.createElement("div");
            grp.className = "chip-group";
            cur.chips.forEach(txt => {
                let c = document.createElement("div");
                c.className = "chip"; c.innerText = txt;
                c.onclick = () => { grp.remove(); handleInput(txt); };
                grp.appendChild(c);
            });
            document.getElementById("chat").appendChild(grp);
            scroll();
        }
    } else {
        botMsg(lang === 'mr' ? "🙏 रिपोर्ट सबमिट होत आहे..." : "🙏 Submitting report...");
        sendToSheet(reportData);
    }
}

function handleInput(v) {
    userMsg(v);
    reportData["step_" + step] = v;
    step++;
    setTimeout(askQ, 600);
}

function send() {
    let inp = document.getElementById("userInput");
    let v = inp.value.trim();
    if (!v) return;
    let chips = document.querySelector('.chip-group:last-child');
    if(chips && step > 0) chips.remove();
    handleInput(v);
    inp.value = ""; inp.focus();
}

function sendToSheet(finalData) {
    const scriptURL = "तुमची_DEPLOYED_WEB_APP_URL_येथे_टाका";
    
    fetch(scriptURL, { 
        method: "POST", 
        mode: "no-cors", // महत्त्वाचे: Google Script साठी 
        cache: "no-cache",
        body: JSON.stringify(finalData) 
    })
    .then(() => {
        botMsg(lang === 'mr' ? "✅ रिपोर्ट यशस्वीपणे सेव्ह झाला!" : "✅ Report saved successfully!");
    })
    .catch(() => botMsg("Error saving data."));
}

function botMsg(t) {
    let d = document.createElement("div"); d.className = "bubble bot"; d.innerText = t;
    document.getElementById("chat").appendChild(d); scroll();
}

function userMsg(t) {
    let d = document.createElement("div"); d.className = "bubble user"; d.innerText = t;
    document.getElementById("chat").appendChild(d); scroll();
}

function scroll() { let c = document.getElementById("chat"); c.scrollTop = c.scrollHeight; }

window.visualViewport.addEventListener('resize', () => {
    document.getElementById('mainContainer').style.height = window.visualViewport.height + 'px';
    scroll();
});
</script>
</body>
</html>
