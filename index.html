<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suraksha Vigil AI | Professional</title>
    <style>
        :root { 
            --wa-teal: #075e54; 
            --wa-light: #dcf8c6; 
            --wa-bg: #efeae2; 
            --wa-header: #075e54;
            --wa-bg-color: #d1d7db;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Fixed Body Height for Mobile Keyboard */
        body, html { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%;
            background: var(--wa-bg-color);
            display: flex; justify-content: center;
            overflow: hidden; 
        }

        .app-container { 
            width: 100%; max-width: 500px; 
            height: 100dvh; /* Dynamic Viewport Height */
            background: var(--wa-bg); 
            display: flex; flex-direction: column; 
            position: relative;
        }

        /* Header (WhatsApp Style) */
        .header { 
            background: var(--wa-header); color: white; padding: 10px 16px; 
            display: flex; align-items: center; justify-content: space-between; 
            min-height: 60px; z-index: 100; flex-shrink: 0;
        }
        .bot-info { display: flex; align-items: center; gap: 12px; }
        .avatar { 
            width: 40px; height: 40px; border-radius: 50%; background: #fff; 
            display: flex; align-items: center; justify-content: center; font-size: 22px; 
        }

        /* Chat Window - Fixes Keyboard Overlap */
        .chat-window { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-size: cover;
            scroll-behavior: smooth;
        }

        .bubble { 
            max-width: 85%; padding: 8px 12px; margin-bottom: 10px; 
            border-radius: 10px; font-size: 15px; line-height: 1.4; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative;
            white-space: pre-line;
        }
        .bot { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .user { background: var(--wa-light); align-self: flex-end; border-top-right-radius: 0; }

        .chip-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .chip { 
            background: #fff; border: 1px solid var(--wa-teal); color: var(--wa-teal); 
            padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
        }

        /* Input Area - Cleaner Icon */
        .input-bar { 
            padding: 8px 12px; background: #f0f0f0; display: flex; 
            align-items: center; gap: 8px; min-height: 60px; flex-shrink: 0;
        }
        .text-input { 
            flex: 1; padding: 12px 18px; border-radius: 25px; 
            border: none; outline: none; font-size: 16px; background: #fff;
        }
        .icon-btn { 
            width: 48px; height: 48px; background: var(--wa-teal); 
            color: white; border: none; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s;
        }
        .icon-btn svg { width: 22px; height: 22px; fill: white; margin-left: 3px; }

        /* Call Screen */
        .call-ui { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #054d44; color: white; display: none; 
            flex-direction: column; align-items: center; z-index: 200; padding-top: 60px;
        }
        .call-profile { width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; border: 2px solid rgba(255,255,255,0.2); }
        .pulse { animation: pulse-anim 1.5s infinite; }
        @keyframes pulse-anim { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); } 70% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
        
        .dial-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .key { width: 60px; height: 60px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-size: 20px; cursor: pointer; }
        .end-btn { width: 70px; height: 70px; background: #ff3b30; border-radius: 50%; border: none; color: white; font-size: 30px; margin-top: auto; margin-bottom: 50px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container" id="mainContainer">
    <div class="header">
        <div class="bot-info">
            <div class="avatar">🛡️</div>
            <div><b>Suraksha Vigil</b><br><small>Online</small></div>
        </div>
        <div onclick="startCall()" style="cursor:pointer; font-size: 22px;">📞</div>
    </div>

    <div class="chat-window" id="chat">
        <div class="bubble bot">
            नमस्कार 👋 मी Suraksha Vigil Bot आहे.
            रिपोर्टिंग करण्यासाठी भाषा निवडा:
            <div class="chip-group">
                <div class="chip" onclick="initChat('mr')">मराठी</div>
                <div class="chip" onclick="initChat('en')">English</div>
            </div>
        </div>
    </div>

    <div class="input-bar" id="inputBar" style="display:none;">
        <input type="text" id="userInput" class="text-input" placeholder="टाईप करा..." onkeypress="if(event.key==='Enter') send()">
        <button class="icon-btn" onclick="send()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
        <button class="icon-btn" style="background:#555; margin-left:5px;" onclick="startRecognition()">🎤</button>
    </div>

    <div class="call-ui" id="callUi">
        <div class="call-profile" id="callAv">🛡️</div>
        <h2 id="callTitle">Suraksha Vigil</h2>
        <p id="callStatus">Connecting...</p>
        <div class="dial-pad" id="dialer">
            <button class="key" onclick="pressKey(1)">1</button>
            <button class="key" onclick="pressKey(2)">2</button>
            <button class="key" onclick="pressKey(3)">3</button>
        </div>
        <button class="end-btn" onclick="endCall()">✖</button>
    </div>
</div>

<audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-preview.mp3"></audio>

<script>
let step = 0;
let data = {};
let lang = "en";
let isCall = false;
let isRep = false;
let synth = window.speechSynthesis;
let rec;

const q_en = [
    "Choose language (EN/MR)",
    "Who are you reporting as? (Patient/Doctor/Pharmacist/Student)",
    "Can you tell me your village or city? 📍",
    "Patient name?",
    "Patient age?",
    "Gender?",
    "Which medicine was taken? 💊",
    "What side effect did you notice?",
    "When did it start?",
    "How serious was it? (Mild/Moderate/Severe)",
    "Did patient need hospital visit?",
    "Any other diseases or medicines?"
];

const q_mr = [
    "भाषा निवडा (EN/MR)",
    "तुम्ही कोण म्हणून report करत आहात? (Patient/Doctor/Pharmacist/Student)",
    "तुमचं गाव / शहर सांगाल का? 📍",
    "रुग्णाचं नाव?",
    "वय?",
    "लिंग?",
    "कोणतं औषध घेतलं होतं? 💊",
    "काय त्रास जाणवला?",
    "कधी सुरू झाला?",
    "Severity किती होती? (Mild/Moderate/Severe)",
    "Hospital ला जावं लागलं का?",
    "इतर आजार किंवा औषधं आहेत का?"
];

function initChat(l) {
    lang = l;
    document.getElementById('inputBar').style.display = 'flex';
    userMsg(l==='mr'?'मराठी':'English');
    step = 0;
    next();
}

function botMsg(t) {
    let div = document.createElement("div");
    div.className = "bubble bot";
    div.innerText = t;
    document.getElementById("chat").appendChild(div);
    scrollDown();
}

function userMsg(t) {
    let div = document.createElement("div");
    div.className = "bubble user";
    div.innerText = t;
    document.getElementById("chat").appendChild(div);
    scrollDown();
}

function scrollDown() {
    const chat = document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
}

function next() {
    step++;
    let q = lang === "mr" ? q_mr : q_en;
    if(step < q.length) {
        setTimeout(() => {
            botMsg(q[step]);
            if(isCall) botSpeak(q[step]);
        }, 600);
    } else {
        botMsg(lang === "mr" ? "🙏 धन्यवाद! तुमचा रिपोर्ट नोंदवला गेला आहे." : "🙏 Thank you! Your report is submitted.");
        if(isCall) {
            botSpeak("Thank you, report saved.");
            setTimeout(endCall, 2500);
        }
    }
}

function send() {
    let inp = document.getElementById("userInput");
    let val = inp.value.trim();
    if(!val) return;
    userMsg(val);
    data["step_"+step] = val;
    inp.value = "";
    inp.focus(); // Key feature: Keeps keyboard open
    next();
}

function botSpeak(t) {
    synth.cancel();
    let m = new SpeechSynthesisUtterance(t);
    m.lang = lang === 'mr' ? 'mr-IN' : 'en-US';
    m.onend = () => { if(isCall && isRep) startRecognition(); };
    synth.speak(m);
}

function startRecognition() {
    const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
    if(!Speech) return;
    rec = new Speech();
    rec.lang = lang === 'mr' ? 'mr-IN' : 'en-US';
    rec.onstart = () => {
        document.getElementById('callAv').classList.add('pulse');
        document.getElementById('callStatus').innerText = "Listening...";
    };
    rec.onresult = (e) => {
        let res = e.results[0][0].transcript;
        userMsg(res);
        data["step_"+step] = res;
        next();
    };
    rec.onend = () => {
        document.getElementById('callAv').classList.remove('pulse');
        if(isCall && isRep && !synth.speaking) {
            setTimeout(() => { if(isCall && isRep) rec.start(); }, 1500);
        }
    };
    rec.start();
}

function startCall() {
    isCall = true;
    document.getElementById('callUi').style.display = 'flex';
    botSpeak("Welcome to Suraksha Vigil. Press 1 to start.");
}

function pressKey(k) {
    if(k === 1) {
        isRep = true;
        document.getElementById('dialer').style.display = 'none';
        step = 0;
        next();
    }
}

function endCall() {
    document.getElementById('beep').play();
    isCall = false; isRep = false;
    document.getElementById('callUi').style.display = 'none';
    document.getElementById('dialer').style.display = 'grid';
    synth.cancel();
    if(rec) rec.abort();
}

// Fix for Visual Viewport (Keyboard behavior)
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
        document.getElementById('mainContainer').style.height = window.visualViewport.height + 'px';
        scrollDown();
    });
}
</script>
</body>
</html>
