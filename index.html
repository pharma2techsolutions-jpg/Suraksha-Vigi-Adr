<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suraksha Vigil AI | Professional Voice</title>
    <style>
        :root { --wa-teal: #075e54; --wa-bg: #efeae2; --accent: #25d366; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: #cfd8dc; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 500px; height: 100dvh; background: var(--wa-bg); margin: auto; display: flex; flex-direction: column; position: relative; }

        /* Real Voice Call Interface */
        #voiceOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #084d44, #075e54);
            z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: space-around; color: white; text-align: center;
        }
        .caller-id { margin-top: 50px; }
        .caller-id h2 { font-size: 28px; margin: 10px 0; }
        .caller-id p { color: #25d366; font-weight: bold; letter-spacing: 1px; }

        .avatar-large { width: 150px; height: 150px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 80px; box-shadow: 0 0 30px rgba(0,0,0,0.3); position: relative; }
        .pulse-ring { position: absolute; width: 100%; height: 100%; border: 3px solid #25d366; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        .call-controls { margin-bottom: 50px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .end-btn { width: 75px; height: 75px; background: #ff3b30; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .transcript-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; width: 80%; font-style: italic; min-height: 50px; }

        /* Chat UI */
        .header { background: var(--wa-teal); color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .call-icon-btn { background: #25d366; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .bubble { padding: 12px; margin-bottom: 10px; border-radius: 10px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .bot { background: white; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .chip-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .chip { background: white; border: 1px solid var(--wa-teal); color: var(--wa-teal); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- UI: CALL OVERLAY (हेल्पलाइन स्क्रीन) -->
    <div id="voiceOverlay">
        <div class="caller-id">
            <div class="avatar-large">
                <div class="pulse-ring"></div>
                🛡️
            </div>
            <h2>Suraksha Vigil AI</h2>
            <p>HELPLINE CONNECTED</p>
        </div>

        <div class="transcript-box" id="voiceText">
            कॉल जोडला जात आहे...
        </div>

        <div class="call-controls">
            <div class="chip-group" id="ivrOptions" style="display:none; justify-content: center;">
                <div class="chip" onclick="handleIVR('1')">1</div>
                <div class="chip" onclick="handleIVR('2')">2</div>
                <div class="chip" onclick="handleIVR('3')">3</div>
                <div class="chip" onclick="handleIVR('4')">4</div>
            </div>
            <button class="end-btn" onclick="hangUp()">
                <svg width="35" height="35" viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
        </div>
    </div>

    <!-- UI: MAIN HEADER -->
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="background:white; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:20px;">🛡️</div>
            <div><b>Suraksha Vigil AI</b><br><small>Online</small></div>
        </div>
        <button class="call-icon-btn" onclick="initiateCall()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
    </div>

    <div class="chat-area" id="chat">
        <div class="bubble bot">नमस्कार! सुरक्षा विजिल मध्ये आपले स्वागत आहे. माहितीसाठी कॉल बटण दाबा किंवा चॅट सुरू करा.</div>
    </div>
</div>

<script>
    const voiceText = document.getElementById("voiceText");
    const voiceOverlay = document.getElementById("voiceOverlay");
    const ivrOptions = document.getElementById("ivrOptions");

    // १. कॉल सुरू करणे
    function initiateCall() {
        voiceOverlay.style.display = "flex";
        if (navigator.vibrate) navigator.vibrate(100);
        
        let welcomeMsg = "सुरक्षा विजिल हेल्पलाइनमध्ये आपले स्वागत आहे. ADR रिपोर्टिंगसाठी ४ दाबा. इतर माहितीसाठी १, २ किंवा ३ दाबा.";
        speak(welcomeMsg);
        
        setTimeout(() => {
            ivrOptions.style.display = "flex";
        }, 1000);
    }

    // २. AI आवाज (Text to Speech)
    function speak(text) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'mr-IN';
        utterance.rate = 0.9;
        
        utterance.onstart = () => {
            voiceText.innerText = text;
        };
        
        window.speechSynthesis.speak(utterance);
    }

    // ३. IVR ऑप्शन्स हाताळणे
    function handleIVR(option) {
        if (navigator.vibrate) navigator.vibrate(50);
        
        if (option === '4') {
            speak("ठीक आहे, आपण कॉलद्वारे रिपोर्ट करत आहात. कृपया रुग्णाचे नाव सांगा.");
            // येथे तुझे चॅटचे रिपोर्टिंग फंक्शन्स कॉल करू शकतोस
        } else if (option === '3') {
            speak("हा प्रोजेक्ट डॉक्टर भूषण पवार सर यांच्या मार्गदर्शनाखाली तयार झाला आहे. धन्यवाद.");
        } else {
            speak("पर्याय " + option + " निवडला आहे. अधिक माहिती लवकरच उपलब्ध होईल.");
        }
    }

    // ४. कॉल कट करणे
    function hangUp() {
        window.speechSynthesis.cancel();
        voiceOverlay.style.display = "none";
        ivrOptions.style.display = "none";
        if (navigator.vibrate) navigator.vibrate([50, 50]);
    }
</script>

</body>
</html>
