<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Suraksha Vigil AI</title>
    <style>
        :root {
            --whatsapp-teal: #075e54;
            --whatsapp-light: #dcf8c6;
            --bg-color: #efeae2;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Roboto', sans-serif; background: #000;
            display: flex; justify-content: center;
        }

        /* Container - Mobile First */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Header */
        .header {
            background: var(--whatsapp-teal);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 65px;
        }

        .bot-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        
        .header-actions { display: flex; gap: 20px; font-size: 20px; cursor: pointer; }

        /* Chat Area */
        .chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            display: flex;
            flex-direction: column;
        }

        .bubble {
            max-width: 80%;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .bot-msg { background: white; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .user-msg { background: var(--whatsapp-light); align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Input Bar */
        .input-bar {
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f0f0;
        }

        .text-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .btn-round {
            width: 45px;
            height: 45px;
            background: var(--whatsapp-teal);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
        }

        /* Call UI Overlay */
        .call-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #054d44;
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding: 40px 0;
        }

        .call-info { text-align: center; }
        .call-info h2 { margin: 10px 0; font-weight: normal; }
        .pulse-mic {
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(255,255,255,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .end-btn { width: 70px; height: 70px; background: #ff3b30; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; color: white; font-size: 30px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="bot-profile">
            <div class="avatar">🛡️</div>
            <div>
                <b id="bot-name">Suraksha Vigil</b><br>
                <small id="status">Online</small>
            </div>
        </div>
        <div class="header-actions">
            <span onclick="startCall()">📞</span>
            <span onclick="toggleLang()">🌐</span>
        </div>
    </div>

    <div class="chat-window" id="chat"></div>

    <div class="input-bar">
        <input type="text" id="userInput" class="text-input" placeholder="येथे टाइप करा...">
        <button class="btn-round" onclick="handleSend()">➤</button>
        <button class="btn-round" onclick="startVoiceRecognition()">🎤</button>
    </div>

    <div class="call-overlay" id="callOverlay">
        <div class="call-info">
            <div class="avatar" style="width:80px; height:80px; margin:0 auto; font-size:40px;">🛡️</div>
            <h2>Suraksha Vigil</h2>
            <p id="call-subtitle">बोलत राहा...</p>
        </div>
        <div class="pulse-mic">🎙️</div>
        <button class="end-btn" onclick="endCall()">📞</button>
    </div>
</div>

<script>
    let currentLang = 'mr';
    let step = 0;
    let isCallMode = false;
    let capturedData = {};

    const script = {
        mr: [
            "नमस्कार, मी सुरक्षा विजील हेल्पलाईनमधून बोलत आहे. मला ADR रिपोर्टिंग करायची आहे.",
            "सर्वात आधी तुमचे पूर्ण नाव सांगा.",
            "रुग्णाचे वय किती आहे?",
            "कोणत्या औषधामुळे त्रास झाला?",
            "नेमका काय त्रास झाला ते थोडक्यात सांगा.",
            "ठीक आहे, हा त्रास कधी सुरू झाला?",
            "धन्यवाद! तुमचा रिपोर्ट सुरक्षितपणे नोंदवण्यात आला आहे."
        ],
        en: [
            "Hello, I am calling from Suraksha Vigil helpline. I want to do ADR reporting.",
            "First, please tell me your full name.",
            "What is the patient's age?",
            "Which medicine caused the reaction?",
            "Describe the reaction in short.",
            "When did this happen?",
            "Thank you! Your report has been recorded safely."
        ]
    };

    // UI: Add Message
    function addBubble(text, sender) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `bubble ${sender}-msg`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // Voice Synthesis (Bot speaks)
    function botSpeak(text) {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel(); // Stop any current speech
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = currentLang === 'mr' ? 'mr-IN' : 'en-US';
        msg.rate = 1.0;
        
        msg.onend = () => {
            if(isCallMode && step < script[currentLang].length - 1) {
                setTimeout(startVoiceRecognition, 500);
            }
        };
        window.speechSynthesis.speak(msg);
    }

    // Validation Logic
    function validateInput(input) {
        if (step === 1) { // Name validation
            if (input.trim().length < 3) {
                const err = currentLang === 'mr' ? "माफ करा, तुमचे नाव पुन्हा नीट सांगा." : "Sorry, please say your name clearly.";
                addBubble(err, 'bot');
                botSpeak(err);
                return false;
            }
        }
        if (step === 2) { // Age validation
            const age = parseInt(input.replace(/\D/g,''));
            if (isNaN(age) || age <= 0 || age > 120) {
                const err = currentLang === 'mr' ? "माफ करा, तुमचे वय आकड्यामध्ये पुन्हा सांगा." : "Please mention your age in numbers.";
                addBubble(err, 'bot');
                botSpeak(err);
                return false;
            }
        }
        return true;
    }

    // Logic: Process Input
    function processInput(input) {
        if (!validateInput(input)) return;

        capturedData[`step_${step}`] = input;
        step++;

        if (step < script[currentLang].length) {
            const nextQ = script[currentLang][step];
            setTimeout(() => {
                addBubble(nextQ, 'bot');
                if (isCallMode) botSpeak(nextQ);
            }, 800);
        }
    }

    // Input Handlers
    function handleSend() {
        const input = document.getElementById('userInput');
        if (!input.value.trim()) return;
        addBubble(input.value, 'user');
        processInput(input.value);
        input.value = "";
    }

    function startVoiceRecognition() {
        const Recognition = window.webkitSpeechRecognition || window.SpeechRecognition;
        if (!Recognition) return alert("Browser does not support voice.");

        const rec = new Recognition();
        rec.lang = currentLang === 'mr' ? 'mr-IN' : 'en-US';
        
        if(isCallMode) document.getElementById('call-subtitle').innerText = "मी ऐकत आहे...";
        
        rec.start();
        rec.onresult = (e) => {
            const result = e.results[0][0].transcript;
            addBubble(result, 'user');
            processInput(result);
        };
        
        rec.onerror = () => {
            if(isCallMode) setTimeout(startVoiceRecognition, 1000);
        };
    }

    // Mode Toggles
    function startCall() {
        isCallMode = true;
        step = 0;
        document.getElementById('callOverlay').style.display = "flex";
        addBubble(script[currentLang][0], 'bot');
        botSpeak(script[currentLang][0]);
    }

    function endCall() {
        isCallMode = false;
        document.getElementById('callOverlay').style.display = "none";
        speechSynthesis.cancel();
    }

    function toggleLang() {
        currentLang = currentLang === 'mr' ? 'en' : 'mr';
        alert("Language: " + (currentLang === 'mr' ? "मराठी" : "English"));
    }

    // Init
    window.onload = () => {
        addBubble(script[currentLang][0], 'bot');
    };
</script>

</body>
</html>
