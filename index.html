<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suraksha Vigil AI Helpline</title>
    <style>
        :root { --wa-teal: #075e54; --wa-light: #dcf8c6; --wa-bg: #efeae2; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Helvetica, sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; background: #d1d7db; display: flex; justify-content: center; }

        .app-container { width: 100%; max-width: 450px; height: 100dvh; background: var(--wa-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.2); overflow: hidden; }
        
        /* Header */
        .header { background: var(--wa-teal); color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; height: 60px; z-index: 10; }
        .bot-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* Chat Window */
        .chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .bubble { max-width: 85%; padding: 10px 14px; margin-bottom: 10px; border-radius: 12px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); line-height: 1.4; position: relative; }
        .bot-msg { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .user-msg { background: var(--wa-light); align-self: flex-end; border-top-right-radius: 0; }

        /* Input Area */
        .input-bar { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 8px; border-top: 1px solid #ddd; }
        .text-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
        .action-btn { width: 45px; height: 45px; background: var(--wa-teal); color: white; border: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; }

        /* Call Screen */
        .call-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #054d44; color: white; display: none; flex-direction: column; align-items: center; z-index: 100; padding-top: 40px; text-align: center; }
        .call-avatar { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; transition: 0.3s; }
        .listening-active { box-shadow: 0 0 20px #25d366; border: 2px solid #25d366; transform: scale(1.05); }

        .call-btns { display: flex; gap: 15px; margin-top: 20px; }
        .call-opt { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        
        .dial-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; }
        .dial-btn { width: 60px; height: 60px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; }

        .end-call-btn { width: 65px; height: 65px; background: #ff3b30; border-radius: 50%; border: none; color: white; font-size: 30px; margin-top: auto; margin-bottom: 40px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="bot-profile">
            <div class="avatar">🛡️</div>
            <div><b>Suraksha Vigil</b><br><small>Online</small></div>
        </div>
        <span onclick="startCall()" style="cursor:pointer; font-size: 22px;">📞</span>
    </div>

    <div class="chat-window" id="chat">
        <div class="bubble bot-msg">
            नमस्कार! सुरक्षा विजील हेल्पलाईन मध्ये आपले स्वागत आहे. <br>
            तुमची भाषा निवडा:
            <div style="margin-top:10px;">
                <button class="call-opt" style="color:black; border-color: black;" onclick="setLang('mr')">मराठी</button>
                <button class="call-opt" style="color:black; border-color: black;" onclick="setLang('en')">English</button>
            </div>
        </div>
    </div>

    <div class="input-bar" id="inputArea" style="display:none;">
        <input type="text" id="userInput" class="text-input" placeholder="टाइप करा...">
        <button class="action-btn" onclick="handleSend()">➤</button>
        <button class="action-btn" onclick="startVoice()">🎤</button>
    </div>

    <div class="call-screen" id="callScreen">
        <div class="call-avatar" id="callAv">🛡️</div>
        <h3 id="call-title">Connecting...</h3>
        <p id="call-status">कृपया वाट पहा</p>

        <div id="dialer" class="dial-pad">
            <button class="dial-btn" onclick="pressKey(1)">1</button>
            <button class="dial-btn" onclick="pressKey(2)">2</button>
            <button class="dial-btn">3</button>
        </div>

        <div id="callResponseBtns" class="call-btns" style="display:none;">
            <button class="call-opt" onclick="voiceInputOverride('पुरुष')">पुरुष (Male)</button>
            <button class="call-opt" onclick="voiceInputOverride('महिला')">महिला (Female)</button>
        </div>

        <button class="end-call-btn" onclick="endCall()">✖</button>
    </div>
</div>

<audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<script>
    let lang = 'mr';
    let step = -1;
    let isCall = false;
    let reportActive = false;
    let synth = window.speechSynthesis;

    const script = {
        mr: [
            "तुमचे पूर्ण नाव काय आहे?",
            "रुग्णाचे वय किती आहे?",
            "तुम्ही पुरुष आहात की महिला?",
            "कोणत्या औषधामुळे त्रास झाला?",
            "नेमका काय त्रास झाला?",
            "हा त्रास कधी सुरू झाला?",
            "धन्यवाद! तुमचा रिपोर्ट नोंदवण्यात आला आहे."
        ],
        en: [
            "What is your full name?",
            "What is the age of the patient?",
            "Are you male or female?",
            "Which medicine caused the reaction?",
            "What exactly happened?",
            "When did this start?",
            "Thank you! Your report is recorded."
        ]
    };

    function setLang(l) {
        lang = l;
        document.getElementById('inputArea').style.display = 'flex';
        addBubble(l === 'mr' ? "मराठी निवडली" : "English Selected", 'user');
        nextStep();
    }

    function addBubble(txt, sender) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `bubble ${sender}-msg`;
        div.innerText = txt;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function botSpeak(txt) {
        synth.cancel();
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = lang === 'mr' ? 'mr-IN' : 'en-US';
        msg.onend = () => {
            if(isCall && reportActive) startVoice();
        };
        synth.speak(msg);
    }

    function nextStep() {
        step++;
        if (step < script[lang].length) {
            const q = script[lang][step];
            addBubble(q, 'bot');
            if (isCall) {
                botSpeak(q);
                // Show gender buttons only on step 2
                document.getElementById('callResponseBtns').style.display = (step === 2) ? 'flex' : 'none';
            }
        } else {
            document.getElementById('successSound').play();
            if(isCall) botSpeak("धन्यवाद, कॉल संपवत आहे.");
        }
    }

    function handleSend() {
        const input = document.getElementById('userInput');
        if (!input.value.trim()) return;
        addBubble(input.value, 'user');
        input.value = "";
        setTimeout(nextStep, 600);
    }

    function startVoice() {
        const Recognition = window.webkitSpeechRecognition || window.SpeechRecognition;
        if (!Recognition) return;
        const rec = new Recognition();
        rec.lang = lang === 'mr' ? 'mr-IN' : 'en-US';
        
        rec.onstart = () => {
            if(isCall) {
                document.getElementById('callAv').classList.add('listening-active');
                document.getElementById('call-status').innerText = "मी ऐकत आहे, बोला...";
            }
        };

        rec.onresult = (e) => {
            const res = e.results[0][0].transcript;
            if (res.trim() !== "") {
                addBubble(res, 'user');
                nextStep();
            }
        };

        rec.onerror = () => {
            if(isCall && reportActive) {
                botSpeak("माफ करा, मला समजले नाही, कृपया पुन्हा सांगा.");
            }
        };

        rec.onend = () => {
            document.getElementById('callAv').classList.remove('listening-active');
        };

        rec.start();
    }

    function voiceInputOverride(val) {
        addBubble(val, 'user');
        nextStep();
    }

    function startCall() {
        isCall = true;
        document.getElementById('callScreen').style.display = 'flex';
        document.getElementById('call-title').innerText = "Suraksha Vigil Helpline";
        botSpeak("नमस्कार, ADR रिपोर्टिंग साठी १ दाबा, माहितीसाठी २ दाबा.");
    }

    function pressKey(k) {
        if (k === 1) {
            reportActive = true;
            document.getElementById('dialer').style.display = 'none';
            step = -1;
            nextStep();
        }
    }

    function endCall() {
        isCall = false; reportActive = false;
        document.getElementById('callScreen').style.display = 'none';
        document.getElementById('dialer').style.display = 'grid';
        synth.cancel();
    }
</script>

</body>
</html>
