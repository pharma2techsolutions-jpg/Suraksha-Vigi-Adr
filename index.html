<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suraksha Vigil AI | Master Bot</title>
    <style>
        :root { --wa-teal: #075e54; --wa-light: #dcf8c6; --wa-bg: #efeae2; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #d1d7db; display: flex; justify-content: center; overflow: hidden; }

        .app-container { width: 100%; max-width: 500px; height: 100%; background: var(--wa-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        
        /* Header */
        .header { background: var(--wa-teal); color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 60px; z-index: 100; }
        .bot-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        
        /* Chat Area */
        .chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); scroll-behavior: smooth; }
        .bubble { max-width: 85%; padding: 10px 14px; margin-bottom: 10px; border-radius: 12px; font-size: 15px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; word-wrap: break-word; }
        .bot { background: white; align-self: flex-start; border-top-left-radius: 0; white-space: pre-line; }
        .user { background: var(--wa-light); align-self: flex-end; border-top-right-radius: 0; }

        .chip-group { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .chip { background: #fff; border: 1px solid var(--wa-teal); color: var(--wa-teal); padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }

        /* Input Bar */
        .input-bar { padding: 8px 12px; background: #f0f0f0; display: flex; align-items: center; gap: 8px; min-height: 62px; }
        .text-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; outline: none; font-size: 16px; background: #fff; }
        .icon-btn { width: 46px; height: 46px; background: var(--wa-teal); color: white; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }

        /* Call Overlay */
        .call-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #054d44; color: white; display: none; flex-direction: column; align-items: center; z-index: 200; padding-top: 60px; text-align: center; }
        .call-avatar { width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 55px; margin-bottom: 20px; border: 2px solid rgba(255,255,255,0.2); transition: 0.3s; }
        .pulse { animation: pulse-ring 1.5s infinite; border-color: #25d366; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
        
        .dial-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .key { width: 65px; height: 65px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-size: 22px; cursor: pointer; }
        .end-btn { width: 70px; height: 70px; background: #ff3b30; border-radius: 50%; border: none; color: white; font-size: 30px; margin-top: auto; margin-bottom: 50px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="bot-info">
            <div class="avatar">🛡️</div>
            <div><b>Suraksha Vigil</b><br><small>Online</small></div>
        </div>
        <div onclick="startCall()" style="cursor:pointer; font-size: 22px;">📞</div>
    </div>

    <div class="chat-window" id="chat"></div>

    <div class="input-bar" id="inputArea" style="display:none;">
        <input type="text" id="userInput" class="text-input" placeholder="टाईप करा..." onkeypress="if(event.key==='Enter') send()">
        <button class="icon-btn" onclick="send()">➤</button>
        <button class="icon-btn" onclick="startVoice()">🎤</button>
    </div>

    <div class="call-ui" id="callUi">
        <div class="call-avatar" id="callAv">🛡️</div>
        <h2 id="callTitle">Suraksha Vigil Helpline</h2>
        <p id="callStatus">पर्याय निवडा</p>

        <div class="dial-pad" id="dialer">
            <button class="key" onclick="pressKey(1)">1<span>Report</span></button>
            <button class="key" onclick="pressKey(2)">2<span>Info</span></button>
            <button class="key">3</button>
        </div>

        <div id="callChips" class="chip-group" style="display:none; justify-content:center; padding: 20px;">
            </div>

        <button class="end-btn" onclick="endCall()">✖</button>
    </div>
</div>

<audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-preview.mp3"></audio>

<script>
let step = 0;
let data = {};
let lang = "en";
let isCall = false;
let isReporting = false;
let synth = window.speechSynthesis;
let rec;

const q_en = [
    "Hello 👋 I'm Suraksha Vigil Bot.\nChoose language (EN/MR)",
    "Who are you reporting as? (Patient/Doctor/Pharmacist/Student)",
    "Can you tell me your village or city? 📍",
    "Patient name?",
    "Patient age?",
    "Gender?",
    "Which medicine was taken? 💊",
    "What side effect did you notice?",
    "When did it start?",
    "How serious was it? (Mild/Moderate/Severe)",
    "Did patient need hospital visit?",
    "Any other diseases or medicines?"
];

const q_mr = [
    "नमस्कार 👋 मी Suraksha Vigil Bot आहे.\nभाषा निवडा (EN/MR)",
    "तुम्ही कोण म्हणून report करत आहात? (Patient/Doctor/Pharmacist/Student)",
    "तुमचं गाव / शहर सांगाल का? 📍",
    "रुग्णाचं नाव?",
    "वय?",
    "लिंग?",
    "कोणतं औषध घेतलं होतं? 💊",
    "काय त्रास जाणवला?",
    "कधी सुरू झाला?",
    "Severity किती होती? (Mild/Moderate/Severe)",
    "Hospital ला जावं लागलं का?",
    "इतर आजार किंवा औषधं आहेत का?"
];

function bot(msg){
    let div = document.createElement("div");
    div.className = "bubble bot";
    div.innerText = msg;
    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
}

function user(msg){
    let div = document.createElement("div");
    div.className = "bubble user";
    div.innerText = msg;
    document.getElementById("chat").appendChild(div);
    document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
}

window.onload = () => {
    bot(q_en[0]);
    // Language Chips for start
    let group = document.createElement("div");
    group.className = "chip-group";
    group.innerHTML = `<div class="chip" onclick="setLang('en')">English</div><div class="chip" onclick="setLang('mr')">मराठी</div>`;
    document.getElementById("chat").appendChild(group);
};

function setLang(l) {
    lang = l;
    document.getElementById('inputArea').style.display = 'flex';
    user(l === 'mr' ? 'मराठी' : 'English');
    step = 0;
    nextStep();
}

function nextStep() {
    step++;
    let q = lang === "mr" ? q_mr : q_en;
    if(step < q.length) {
        setTimeout(() => {
            bot(q[step]);
            if(isCall) botSpeak(q[step]);
        }, 600);
    } else {
        bot(lang === "mr" ? "🙏 धन्यवाद! तुमचा रिपोर्ट submit झाला आहे." : "🙏 Thank you! Your report is submitted.");
        if(isCall) {
            botSpeak(lang === "mr" ? "धन्यवाद, रिपोर्ट नोंदवला आहे." : "Thank you, report saved.");
            setTimeout(endCall, 2500);
        }
        sendToSheet(data);
    }
}

function send() {
    let input = document.getElementById("userInput");
    let val = input.value.trim();
    if(!val) return;
    user(val);
    data["step_"+step] = val;
    input.value = "";
    input.focus(); // Keep keyboard open
    nextStep();
}

function botSpeak(txt) {
    synth.cancel();
    let m = new SpeechSynthesisUtterance(txt);
    m.lang = lang === 'mr' ? 'mr-IN' : 'en-US';
    m.onend = () => { if(isCall && isReporting) startVoice(); };
    synth.speak(m);
}

function startVoice() {
    const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
    if(!Speech) return;
    rec = new Speech();
    rec.lang = lang === 'mr' ? 'mr-IN' : 'en-US';
    rec.onstart = () => {
        document.getElementById('callAv').classList.add('pulse');
        document.getElementById('callStatus').innerText = "Listening...";
    };
    rec.onresult = (e) => {
        let res = e.results[0][0].transcript;
        user(res);
        data["step_"+step] = res;
        nextStep();
    };
    rec.onend = () => {
        document.getElementById('callAv').classList.remove('pulse');
        if(isCall && isReporting && !synth.speaking) {
            setTimeout(() => { if(isCall && isReporting) rec.start(); }, 1500);
        }
    };
    rec.onerror = () => { if(isCall) botSpeak("Please repeat."); };
    rec.start();
}

function startCall() {
    isCall = true;
    document.getElementById('callUi').style.display = 'flex';
    botSpeak("Welcome. Press 1 to start ADR reporting.");
}

function pressKey(k) {
    if(k === 1) {
        isReporting = true;
        document.getElementById('dialer').style.display = 'none';
        step = 0;
        nextStep();
    }
}

function endCall() {
    document.getElementById('beep').play();
    isCall = false; isReporting = false;
    document.getElementById('callUi').style.display = 'none';
    document.getElementById('dialer').style.display = 'grid';
    synth.cancel();
    if(rec) rec.abort();
}

function sendToSheet(data){
    fetch("YOUR_GOOGLE_SCRIPT_URL", { method: "POST", body: JSON.stringify(data) });
}

// Fixed scroll on resize
window.addEventListener('resize', () => {
    let chat = document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
