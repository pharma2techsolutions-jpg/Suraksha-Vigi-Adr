<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suraksha Vigil Bot</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
            background: #d1d7db; 
            display: flex; 
            justify-content: center; 
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Responsive Container */
        .chat-app { 
            width: 100%; 
            max-width: 500px; 
            height: 100%; 
            background: #efeae2; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        /* Header */
        .header { 
            background: #075e54; 
            color: white; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 5;
        }
        
        .bot-info { display: flex; align-items: center; gap: 10px; }
        .bot-info b { font-size: 18px; }
        .lang-btn { 
            background: #128c7e; 
            border: 1px solid #fff; 
            color: white; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 12px;
            cursor: pointer;
        }

        /* Chat Window */
        .chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
        }

        .msg { 
            max-width: 85%; 
            padding: 10px 14px; 
            margin: 8px 0; 
            border-radius: 12px; 
            font-size: 15px; 
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        
        .bot { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .user { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }

        /* Input Area */
        .input-area { 
            display: flex; 
            padding: 10px; 
            background: #f0f0f0; 
            align-items: center;
            gap: 8px;
        }

        input { 
            flex: 1; 
            padding: 12px 15px; 
            border-radius: 25px; 
            border: none; 
            outline: none; 
            font-size: 16px;
        }

        .icon-btn { 
            background: #075e54; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 45px; 
            height: 45px; 
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
        }

        /* Call Screen overlay */
        .call-screen { 
            position: absolute; 
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            background: #075e54; 
            color: white; 
            display: none; 
            flex-direction: column; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 100; 
            text-align: center;
        }
        .end-call { background: #eb4034; border-radius: 50%; width: 60px; height: 60px; border: none; color: white; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="header">
        <div class="bot-info">
            <b>🛡️ Suraksha Vigil</b>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="lang-btn" onclick="toggleLang()">EN/मराठी</button>
            <span onclick="startCall()" style="cursor:pointer; font-size: 22px;">📞</span>
        </div>
    </div>

    <div class="chat-box" id="chat"></div>

    <div class="input-area">
        <input id="input" type="text" placeholder="येथे टाइप करा...">
        <button class="icon-btn" onclick="send()">➤</button>
        <button class="icon-btn" onclick="startVoice()">🎤</button>
    </div>

    <div class="call-screen" id="callScreen">
        <div>
            <h2>Suraksha Vigil</h2>
            <p id="callStatusText">Reporting चालू आहे...</p>
        </div>
        <div style="font-size: 100px;">🎙️</div>
        <button class="end-call" onclick="endCall()">✖</button>
    </div>
</div>

<script>
    let lang = 'mr'; 
    let step = 0;
    let mode = 'chat';
    let data = {};

    const script = {
        mr: [
            "नमस्कार, मी सुरक्षा विजील हेल्पलाईनमधून बोलत आहे. मला ADR रिपोर्टिंग करायची आहे.",
            "ठीक आहे, चला सुरुवात करूया. सर्वात आधी तुमचे पूर्ण नाव सांगा.",
            "तुमचे वय किती आहे?",
            "कोणत्या औषधामुळे तुम्हाला त्रास झाला?",
            "तुम्हाला नेमका काय त्रास झाला? (उदा. पुरळ येणे, चक्कर येणे)",
            "हा त्रास कधी झाला? तारीख किंवा वेळ सांगा.",
            "धन्यवाद! तुमचा रिपोर्ट नोंदवण्यात आला आहे. आम्ही लवकरच संपर्क करू."
        ],
        en: [
            "Hello, I am from Suraksha Vigil helpline. I want to do ADR reporting.",
            "Sure, let's start. First, tell me your full name.",
            "What is your age?",
            "Which medicine caused the reaction?",
            "What exactly was the reaction? (e.g. Rashes, Dizziness)",
            "When did this happen? Mention date or time.",
            "Thank you! Your report has been recorded. We will contact you soon."
        ]
    };

    function toggleLang() {
        lang = (lang === 'mr') ? 'en' : 'mr';
        alert("Language changed to " + lang.toUpperCase());
    }

    function addMsg(text, type) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
        if (mode !== 'call') return;
        const s = new SpeechSynthesisUtterance(text);
        s.lang = (lang === 'mr') ? 'mr-IN' : 'en-US';
        s.onend = () => {
            if (step < script[lang].length - 1) {
                setTimeout(startVoice, 500);
            }
        };
        speechSynthesis.speak(s);
    }

    function validate(text) {
        if (step === 1 && text.length < 3) return false; // Name check
        if (step === 2 && isNaN(text.replace(/\s/g, ''))) return false; // Age check
        return true;
    }

    function process(text) {
        if (validate(text)) {
            data['field_' + step] = text;
            step++;
            if (step < script[lang].length) {
                let nextMsg = script[lang][step];
                setTimeout(() => {
                    addMsg(nextMsg, "bot");
                    if (mode === 'call') speak(nextMsg);
                }, 800);
            }
        } else {
            let errorMsg = (lang === 'mr') ? "माफ करा, तुमचे उत्तर पुन्हा योग्य पद्धतीने सांगा." : "Sorry, please provide a valid answer.";
            addMsg(errorMsg, "bot");
            if (mode === 'call') speak(errorMsg);
        }
    }

    function send() {
        const input = document.getElementById("input");
        if (!input.value.trim()) return;
        addMsg(input.value, "user");
        process(input.value);
        input.value = "";
    }

    function startVoice() {
        const Speech = window.webkitSpeechRecognition || window.SpeechRecognition;
        if (!Speech) return alert("Your browser does not support speech recognition.");
        
        const rec = new Speech();
        rec.lang = (lang === 'mr') ? 'mr-IN' : 'en-US';
        rec.start();

        rec.onresult = (e) => {
            const result = e.results[0][0].transcript;
            addMsg(result, "user");
            process(result);
        };
    }

    function startCall() {
        mode = 'call';
        document.getElementById("callScreen").style.display = "flex";
        step = 0;
        addMsg(script[lang][0], "bot");
        // Start conversation directly
        speak(script[lang][0]);
    }

    function endCall() {
        mode = 'chat';
        document.getElementById("callScreen").style.display = "none";
        speechSynthesis.cancel();
    }

    window.onload = () => {
        addMsg(script[lang][0], "bot");
    };
</script>

</body>
</html>
