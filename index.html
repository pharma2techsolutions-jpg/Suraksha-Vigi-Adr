<!-- =========================
SURAKSHA VIGIL BOT
FINAL ADVANCED VERSION
========================= -->

<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Suraksha Vigil Bot</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111b21;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* APP */

.app{
width:430px;
height:95vh;
background:#efeae2;
display:flex;
flex-direction:column;
overflow:hidden;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.5);
position:relative;
}

/* HEADER */

.header{
background:#075e54;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

.left{
display:flex;
align-items:center;
}

.dp{
width:42px;
height:42px;
background:white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
margin-right:10px;
}

.icons{
display:flex;
gap:15px;
font-size:20px;
cursor:pointer;
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:10px;
display:flex;
flex-direction:column;
background:#efeae2;
}

.msg{
max-width:75%;
padding:10px;
border-radius:10px;
margin:5px 0;
font-size:14px;
line-height:1.4;
}

.bot{
background:white;
align-self:flex-start;
border-top-left-radius:0;
}

.user{
background:#d9fdd3;
align-self:flex-end;
border-top-right-radius:0;
}

.time{
font-size:10px;
color:gray;
margin-top:4px;
text-align:right;
}

/* INPUT */

.input-area{
display:flex;
padding:8px;
background:#f0f2f5;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:20px;
outline:none;
}

button{
border:none;
cursor:pointer;
}

.send,.mic{
width:42px;
height:42px;
border-radius:50%;
background:#075e54;
color:white;
font-size:18px;
margin-left:5px;
}

/* CHIPS */

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:6px 0;
}

.chip{
background:#128c7e;
color:white;
padding:8px 14px;
border-radius:18px;
font-size:13px;
border:none;
cursor:pointer;
transition:.2s;
}

.chip:hover{
transform:scale(1.05);
}

/* CALL SCREEN */

.call-screen{
position:absolute;
inset:0;
background:#0b141a;
color:white;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
z-index:100;
}

.call-avatar{
width:110px;
height:110px;
border-radius:50%;
background:#075e54;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
margin-bottom:20px;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.call-status{
margin-top:10px;
font-size:15px;
color:#ccc;
}

/* DIAL PAD */

.dialpad{
display:grid;
grid-template-columns:repeat(3,70px);
gap:12px;
margin-top:30px;
}

.dial-btn{
width:70px;
height:70px;
border-radius:50%;
background:#202c33;
color:white;
font-size:25px;
border:none;
}

.end-call{
margin-top:30px;
background:red;
color:white;
padding:12px 25px;
border-radius:25px;
font-size:16px;
}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<div class="left">

<div class="dp">🛡️</div>

<div>
<b>Suraksha Vigil Bot</b><br>
<small>online</small>
</div>

</div>

<div class="icons">
<span onclick="startCall()">📞</span>
</div>

</div>

<!-- CHAT -->

<div class="chat" id="chat"></div>

<!-- INPUT -->

<div class="input-area">

<input type="text" id="input" placeholder="Type message...">

<button class="send" onclick="send()">➤</button>

<button class="mic" onclick="voiceInput()">🎤</button>

</div>

<!-- CALL UI -->

<div class="call-screen" id="callScreen">

<div class="call-avatar">🛡️</div>

<h2>Suraksha Vigil Helpline</h2>

<div class="call-status" id="callText">
Connecting...
</div>

<!-- DIAL PAD -->

<div class="dialpad">

<button class="dial-btn" onclick="menuOption(1)">1</button>

<button class="dial-btn" onclick="menuOption(2)">2</button>

<button class="dial-btn" onclick="menuOption(3)">3</button>

<button class="dial-btn" onclick="menuOption(4)">4</button>

<button class="dial-btn" onclick="menuOption(5)">5</button>

</div>

<button class="end-call" onclick="endCall()">End Call</button>

</div>

</div>

<script>

/* VARIABLES */

let lang="mr";
let step=0;
let mode="chat";

const chat=document.getElementById("chat");

/* QUESTIONS */

const questions=[

"तुम्ही कोण आहात?",

"तुमचे गाव कोणते?",

"रुग्णाचे नाव काय आहे?",

"वय किती आहे?",

"लिंग काय आहे?",

"कोणते औषध घेतले होते?",

"काय त्रास झाला?",

"कधी सुरू झाला?",

"त्रास किती गंभीर होता?",

"हॉस्पिटलला जावे लागले का?"

];

/* MESSAGE */

function addMsg(msg,type){

let d=document.createElement("div");

d.className="msg "+type;

d.innerHTML=msg+`<div class='time'>${new Date().toLocaleTimeString()}</div>`;

chat.appendChild(d);

chat.scrollTop=chat.scrollHeight;

}

/* SPEAK */

function speak(text){

let s=new SpeechSynthesisUtterance(text);

s.lang="mr-IN";

speechSynthesis.speak(s);

}

/* START */

window.onload=()=>{

addMsg("नमस्कार 👋<br><br>Suraksha Vigil Bot मध्ये तुमचे स्वागत आहे.<br><br>ADR reporting साठी खालील पर्याय वापरा.","bot");

showChips(["ADR म्हणजे काय?","ADR reporting चे फायदे","Project माहिती","Voice ADR Reporting"]);

}

/* CHIPS */

function showChips(arr){

let wrap=document.createElement("div");

wrap.className="chips";

arr.forEach(x=>{

let b=document.createElement("button");

b.className="chip";

b.innerText=x;

b.onclick=()=>chipAction(x);

wrap.appendChild(b);

});

chat.appendChild(wrap);

}

/* CHIP ACTION */

function chipAction(x){

addMsg(x,"user");

if(x==="ADR म्हणजे काय?"){

let msg="ADR म्हणजे औषध घेतल्यानंतर होणारा अनपेक्षित त्रास किंवा दुष्परिणाम. ADR reporting मुळे औषध सुरक्षितता वाढते आणि भविष्यातील गंभीर धोके टाळता येतात.";

addMsg(msg,"bot");

speak(msg);

}

else if(x==="ADR reporting चे फायदे"){

let msg="ADR reporting मुळे डॉक्टर आणि आरोग्य विभागाला औषधांचे दुष्परिणाम समजतात. त्यामुळे रुग्णांची सुरक्षितता वाढते, नवीन चेतावणी देता येते आणि गंभीर परिणाम टाळता येतात.";

addMsg(msg,"bot");

speak(msg);

}

else if(x==="Project माहिती"){

let msg="Suraksha Vigil हा आधुनिक ADR reporting project आहे. या project साठी Doctor Bhushan Pawar Sir यांनी आम्हाला अमूल्य मार्गदर्शन केले. त्यांच्या प्रेरणेमुळे आणि योग्य दिशेमुळे आम्ही ADR reporting साठी एक स्मार्ट voice आणि chatbot आधारित portal तयार करू शकलो. औषध सुरक्षिततेबद्दल जनजागृती करणे आणि ADR reporting अधिक सोपी करणे हे या project चे मुख्य उद्दिष्ट आहे.";

addMsg(msg,"bot");

speak(msg);

}

else if(x==="Voice ADR Reporting"){

startCall();

}

}

/* SEND */

function send(){

let v=input.value.trim();

if(!v)return;

addMsg(v,"user");

input.value="";

}

/* VOICE INPUT */

function voiceInput(){

let r=new webkitSpeechRecognition();

r.lang="mr-IN";

r.start();

r.onresult=e=>{

let text=e.results[0][0].transcript;

addMsg(text,"user");

};

}

/* CALL START */

function startCall(){

mode="call";

document.getElementById("callScreen").style.display="flex";

document.getElementById("callText").innerText="Calling Suraksha Vigil Helpline...";

setTimeout(()=>{

let msg="नमस्कार. Suraksha Vigil Helpline मध्ये तुमचे स्वागत आहे. ADR म्हणजे काय हे जाणून घेण्यासाठी 1 दाबा. ADR reporting चे फायदे जाणून घेण्यासाठी 2 दाबा. Project माहिती साठी 3 दाबा. Voice ADR reporting साठी 4 दाबा. पुन्हा सर्व पर्याय ऐकण्यासाठी 5 दाबा.";

document.getElementById("callText").innerText="Voice Assistant Active";

speak(msg);

},2000);

}

/* MENU */

function menuOption(n){

if(n==1){

let msg="ADR म्हणजे Adverse Drug Reaction. म्हणजे औषध घेतल्यानंतर शरीरावर होणारा अनपेक्षित दुष्परिणाम. ADR reporting मुळे औषध सुरक्षितता वाढते आणि भविष्यातील गंभीर त्रास टाळता येतो.";

document.getElementById("callText").innerText=msg;

speak(msg);

}

else if(n==2){

let msg="ADR reporting चे अनेक फायदे आहेत. त्यामुळे औषधांचे दुष्परिणाम लवकर ओळखता येतात, डॉक्टरांना योग्य माहिती मिळते, रुग्णांची सुरक्षितता वाढते आणि आरोग्य व्यवस्थेमध्ये सुधारणा होते.";

document.getElementById("callText").innerText=msg;

speak(msg);

}

else if(n==3){

let msg="Suraksha Vigil हा एक innovative ADR reporting project आहे. या project साठी Doctor Bhushan Pawar Sir यांनी आम्हाला उत्कृष्ट मार्गदर्शन केले. त्यांच्या अनुभवामुळे आणि प्रेरणेमुळे आम्ही voice based आणि chatbot based ADR reporting system तयार करण्यात यशस्वी झालो. औषध सुरक्षिततेबद्दल जागरूकता निर्माण करणे हे या project चे मुख्य उद्दिष्ट आहे.";

document.getElementById("callText").innerText=msg;

speak(msg);

}

else if(n==4){

document.getElementById("callText").innerText="Connecting to ADR Reporting Agent...";

speak("कृपया थांबा. तुमची कॉल आमच्या ADR reporting agent शी जोडली जात आहे.");

setTimeout(()=>{

step=0;

askCallQuestion();

},4000);

}

else if(n==5){

startCall();

}

}

/* CALL QUESTIONS */

function askCallQuestion(){

if(step>=questions.length){

let endmsg="तुमचा ADR report यशस्वीरित्या नोंदवला गेला आहे. धन्यवाद.";

document.getElementById("callText").innerText=endmsg;

speak(endmsg);

return;

}

let q=questions[step];

document.getElementById("callText").innerText=q;

speak(q);

let r=new webkitSpeechRecognition();

r.lang="mr-IN";

r.start();

r.onresult=e=>{

let ans=e.results[0][0].transcript;

addMsg(q,"bot");

addMsg(ans,"user");

step++;

setTimeout(()=>{

askCallQuestion();

},1000);

};

}

/* END */

function endCall(){

speechSynthesis.cancel();

document.getElementById("callScreen").style.display="none";

mode="chat";

}

</script>

</body>
</html>
