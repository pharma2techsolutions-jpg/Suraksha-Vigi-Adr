<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suraksha Vigil AI | Voice Pro</title>
    <style>
        :root { --wa-teal: #075e54; --wa-light: #dcf8c6; --wa-bg: #efeae2; --wa-header: #075e54; --accent: #25d366; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #d1d7db; display: flex; justify-content: center; overflow: hidden; }
        .app-container { width: 100%; max-width: 500px; height: 100dvh; background: var(--wa-bg); display: flex; flex-direction: column; position: relative; }
        
        /* Voice Call Interface Overlay */
        #voiceOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #075e54, #128c7e);
            z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: space-around; color: white; text-align: center;
        }
        .caller-img { width: 120px; height: 120px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 60px; margin-top: 50px; box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(37, 211, 102, 0.7); } 100% { box-shadow: 0 0 0 30px rgba(37, 211, 102, 0); } }
        .call-status { font-size: 18px; margin-top: 10px; color: #25d366; font-weight: bold; }
        .end-call-btn { width: 70px; height: 70px; background: #ff3b30; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 50px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* UI Elements */
        .progress-container { width: 100%; height: 4px; background: #ccc; position: absolute; top: 60px; z-index: 101; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: 0.3s; }
        .header { background: var(--wa-header); color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 60px; z-index: 100; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .bot-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .call-btn { background: #25d366; border: none; padding: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        .chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; scroll-behavior: smooth; padding-top: 15px; }
        .bubble { max-width: 85%; padding: 12px 16px; margin-bottom: 12px; border-radius: 15px; font-size: 15px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.15); position: relative; }
        .bot { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .user { background: var(--wa-light); align-self: flex-end; border-top-right-radius: 0; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .chip-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .chip { background: white; border: 1.5px solid var(--wa-teal); color: var(--wa-teal); padding: 10px 18px; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .input-bar { padding: 10px 15px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; min-height: 70px; flex-shrink: 0; border-top: 1px solid #ddd; }
        .text-input { flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #ccc; outline: none; font-size: 16px; background: #fff; }
        .send-btn { width: 50px; height: 50px; background: var(--wa-teal); color: white; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container" id="mainContainer">
    <!-- Call Overlay -->
    <div id="voiceOverlay">
        <div>
            <div class="caller-img pulse">🛡️</div>
            <h2>Suraksha Vigil AI</h2>
            <div class="call-status">Connected...</div>
            <p id="voiceTranscript" style="padding: 20px; font-style: italic; opacity: 0.9; font-size: 18px;">"नमस्ते..."</p>
        </div>
        <button class="end-call-btn" onclick="endCall()">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="white"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
        </button>
    </div>

    <div class="header">
        <div class="bot-info">
            <div class="avatar">🛡️</div>
            <div><b>Suraksha Vigil</b><br><small>Online</small></div>
        </div>
        <button class="call-btn" onclick="startCall()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
    </div>
    
    <div class="progress-container"><div class="progress-bar" id="pbar"></div></div>

    <div class="chat-window" id="chat">
        <div class="bubble bot">
            नमस्कार 👋 'सुरक्षा विजिल' मध्ये आपले स्वागत आहे. कृपया आपली भाषा निवडा:
            <div class="chip-group" id="langChips">
                <div class="chip" onclick="setLang('mr')">मराठी 🇮🇳</div>
                <div class="chip" onclick="setLang('en')">English 🇺🇸</div>
            </div>
        </div>
    </div>

    <div class="input-bar" id="inputBar" style="display:none;">
        <input type="text" id="userInput" class="text-input" placeholder="टाईप करा..." onkeypress="if(event.key==='Enter') send()">
        <button class="send-btn" onclick="send()">
            <svg viewBox="0 0 24 24" width="24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>
</div>

<script>
let step = 0;
let reportData = {};
let finalSource = "Web Chat"; 
const scriptURL = "https://script.google.com/macros/s/AKfycbwHdpYghnTnc0KDd8rGwldWbNvm--QZAJmhGeTFj1KyBQ0TnnXGJnnoEJFC7fYn1Z53xQ/exec";

const langMap = {
    "रुग्ण (Patient)": "Patient", "डॉक्टर": "Doctor", "फार्मासिस्ट": "Pharmacist", "विद्यार्थी": "Student",
    "पुरुष (Male)": "Male", "महिला (Female)": "Female", "गोळी (Tablet)": "Tablet", "हो": "Yes", "नाही": "No"
};

const questions = {
    mr: [
        { q: "तुम्ही ही माहिती कोण म्हणून भरत आहात?", chips: ["रुग्ण (Patient)", "डॉक्टर", "फार्मासिस्ट", "विद्यार्थी"] },
        { q: "तुमचे शहर किंवा गाव कोणते? 📍" },
        { q: "रुग्णाचे नाव सांगा." },
        { q: "वय किती आहे?" },
        { q: "लिंग निवडा:", chips: ["पुरुष (Male)", "महिला (Female)"] },
        { q: "औषधाचा प्रकार निवडा:", chips: ["गोळी (Tablet)", "इंजेक्शन", "क्रीम", "सिरप"] },
        { q: "औषधाचे नाव काय होते?" },
        { q: "काय त्रास झाला?", chips: ["चक्कर 😵", "खाज 😣", "ताप 🤒", "मळमळ 🤮"] },
        { q: "कधी सुरू झाला?" },
        { q: "तीव्रता किती होती?", chips: ["सौम्य", "मध्यम", "गंभीर"] },
        { q: "हॉस्पिटलला जावे लागले का?", chips: ["हो", "नाही"] }
    ]
};

function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'mr-IN';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
        document.getElementById("voiceTranscript").innerText = `"${text}"`;
    }
}

function startCall() {
    let intro = "सुरक्षा विजिल हेल्पलाइनमध्ये तुमचे स्वागत आहे. कृपया खालील पर्याय निवडा.";
    botMsg("📞 " + intro + "\n\n1️⃣ ADR रिपोर्टिंग का गरजेचे आहे?\n2️⃣ रिपोर्टिंगचे फायदे.\n3️⃣ सुरक्षा विजिल प्रोजेक्टबद्दल.\n4️⃣ फोनद्वारे ADR रिपोर्ट करा.\n5️⃣ पुन्हा ऐकण्यासाठी.");
    speak(intro);
    showCallChips();
}

function showCallChips() {
    let grp = document.createElement("div");
    grp.className = "chip-group";
    ["1", "2", "3", "4", "5"].forEach(num => {
        let c = document.createElement("div");
        c.className = "chip"; c.innerText = num;
        c.onclick = () => handleCallInput(num);
        grp.appendChild(c);
    });
    document.getElementById("chat").appendChild(grp);
    scroll();
}

function handleCallInput(val) {
    userMsg(val);
    if(val === "1") {
        let t = "औषधांचे दुष्परिणाम शोधून इतरांना सावध करण्यासाठी आणि औषध अधिक सुरक्षित बनवण्यासाठी रिपोर्टिंग गरजेचे आहे.";
        botMsg("💡 " + t); speak(t);
    } else if(val === "2") {
        let t = "यामुळे भविष्यातील गंभीर वैद्यकीय धोके टाळता येतात आणि आरोग्य यंत्रणेत सुधारणा होते.";
        botMsg("✅ " + t); speak(t);
    } else if(val === "3") {
        let t = "हा सुरक्षा विजिल प्रोजेक्ट डॉक्टर भूषण पवार सर यांच्या मार्गदर्शनाखाली साकारला आहे. धन्यवाद सर!";
        botMsg("🏢 " + t + " 🙏"); speak(t);
    } else if(val === "4") {
        finalSource = "IVR Call";
        document.getElementById("voiceOverlay").style.display = "flex";
        let t = "नमस्ते, मी रिपोर्टिंग असिस्टंट. आपण व्हॉइस कॉलद्वारे माहिती भरत आहात. चला सुरुवात करूया.";
        speak(t);
        setTimeout(() => { 
            document.getElementById("voiceOverlay").style.display = "none";
            setLang('mr'); 
        }, 4500);
        return;
    } else if(val === "5") {
        startCall();
        return;
    }
    setTimeout(showCallChips, 2500);
}

function endCall() {
    window.speechSynthesis.cancel();
    document.getElementById("voiceOverlay").style.display = "none";
    botMsg("❌ कॉल समाप्त झाला.");
}

function setLang(l) {
    document.getElementById('langChips').style.display = 'none';
    document.getElementById('inputBar').style.display = 'flex';
    step = 0; askQ();
}

function askQ() {
    updateProgress();
    let qList = questions.mr; 
    if (step < qList.length) {
        let cur = qList[step];
        botMsg(cur.q);
        speak(cur.q);
        if (cur.chips) {
            let grp = document.createElement("div");
            grp.className = "chip-group";
            cur.chips.forEach(txt => {
                let c = document.createElement("div");
                c.className = "chip"; c.innerText = txt;
                c.onclick = () => { grp.remove(); handleInput(txt); };
                grp.appendChild(c);
            });
            document.getElementById("chat").appendChild(grp);
        }
    } else {
        let t = "माहिती यशस्वीपणे नोंदवली आहे. धन्यवाद!";
        botMsg("✅ " + t); speak(t);
        sendToSheet(reportData);
    }
}

function handleInput(v) {
    userMsg(v);
    let cleanVal = v.split(' ')[0];
    reportData["step_" + step] = langMap[cleanVal] || v;
    step++;
    setTimeout(askQ, 800);
}

function send() {
    let inp = document.getElementById("userInput");
    if (!inp.value.trim()) return;
    handleInput(inp.value);
    inp.value = "";
}

function sendToSheet(finalData) {
    finalData["source"] = finalSource;
    fetch(scriptURL, { method: "POST", mode: "no-cors", body: JSON.stringify(finalData) }).then(() => {
        setTimeout(() => { location.reload(); }, 4000);
    });
}

function updateProgress() {
    document.getElementById('pbar').style.width = (step / 11) * 100 + "%";
}

function botMsg(t) {
    let d = document.createElement("div"); d.className = "bubble bot"; d.innerText = t;
    document.getElementById("chat").appendChild(d); scroll();
}

function userMsg(t) {
    let d = document.createElement("div"); d.className = "bubble user"; d.innerText = t;
    document.getElementById("chat").appendChild(d); scroll();
}

function scroll() { let c = document.getElementById("chat"); c.scrollTop = c.scrollHeight; }
</script>
</body>
</html>
