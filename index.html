<!DOCTYPE html>
<html>
<head>
<title>Suraksha Vigil Bot</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#ece5dd;
  display:flex;
  justify-content:center;
}

/* APP */
.chat-app{
  width:420px;
  height:720px;
  background:#efeae2;
  display:flex;
  flex-direction:column;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 25px rgba(0,0,0,0.3);
}

/* HEADER */
.header{
  background:#075e54;
  color:white;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
}

.header img{
  width:35px;
  border-radius:50%;
  margin-right:10px;
}

.header-icons span{
  margin-left:15px;
  cursor:pointer;
  font-size:18px;
}

/* CHAT */
.chat-box{
  flex:1;
  padding:10px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.msg{
  max-width:75%;
  padding:8px 12px;
  margin:5px 0;
  border-radius:8px;
  font-size:14px;
}

.bot{background:#fff;align-self:flex-start;}
.user{background:#dcf8c6;align-self:flex-end;}

.time{
  font-size:10px;
  color:gray;
  text-align:right;
}

/* INPUT */
.input-area{
  display:flex;
  padding:8px;
  background:#f0f0f0;
}

input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
}

button{
  margin-left:5px;
  padding:10px;
  border:none;
  background:#075e54;
  color:white;
  border-radius:50%;
  cursor:pointer;
}

/* OPTIONS */
.options{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.btn{
  padding:6px 12px;
  border-radius:15px;
  border:none;
  background:#128c7e;
  color:white;
  cursor:pointer;
}

/* CALL SCREEN */
.call-screen{
  position:absolute;
  width:100%;
  height:100%;
  background:#075e54;
  color:white;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.call-screen h2{margin:0;}
</style>
</head>

<body>

<div class="chat-app">

<div class="header">
  <div class="header-left">
    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
    <div>
      <b>Suraksha Vigil Bot</b><br>
      <small>online</small>
    </div>
  </div>

  <div class="header-icons">
    <span onclick="startCall()">📞</span>
  </div>
</div>

<div class="chat-box" id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Type message">
  <button onclick="send()">➤</button>
  <button onclick="startVoice()">🎤</button>
</div>

</div>

<!-- CALL UI -->
<div class="call-screen" id="callScreen">
  <h2>📞 Voice Reporting चालू आहे</h2>
  <p>Bot तुमच्याशी बोलत आहे...</p>
  <button onclick="endCall()">End Call</button>
</div>

<script>
let step=0,data={},mode="chat";
const chat=document.getElementById("chat");

/* SIMPLE QUESTIONS */
const q=[
"तुम्ही कोण आहात?",
"तुमचं गाव?",
"रुग्णाचं नाव?",
"वय?",
"लिंग?",
"कोणतं औषध?",
"काय त्रास झाला?",
"कधी झाला?",
"त्रास किती होता?",
"हॉस्पिटलला जावं लागलं का?",
"तुमचं नाव?"
];

/* UI */
function addMsg(msg,type){
  let d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML=msg+`<div class="time">${new Date().toLocaleTimeString()}</div>`;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

/* BOT SPEAK */
function speak(text){
  let s=new SpeechSynthesisUtterance(text);
  s.lang="mr-IN";
  speechSynthesis.speak(s);
}

/* PROCESS */
function process(val){
  data["s"+step]=val;
  step++;

  if(step<q.length){
    setTimeout(()=>{
      addMsg(q[step],"bot");
      if(mode==="call") speak(q[step]);
    },500);
  }else{
    addMsg("✅ Report Submitted","bot");
    sendToSheet(data);
  }
}

/* CHAT SEND */
function send(){
  let v=input.value.trim();
  if(!v)return;
  addMsg(v,"user");
  process(v);
  input.value="";
}

/* VOICE BUTTON */
function startVoice(){
  let r=new webkitSpeechRecognition();
  r.lang="mr-IN";
  r.start();

  r.onresult=e=>{
    let text=e.results[0][0].transcript;
    addMsg(text,"user");
    process(text);
  };
}

/* CALL MODE */
function startCall(){
  mode="call";
  document.getElementById("callScreen").style.display="flex";

  step=0;
  addMsg("📞 Voice Call Started","bot");
  addMsg(q[0],"bot");
  speak(q[0]);

  voiceLoop();
}

function voiceLoop(){
  if(mode!=="call") return;

  let r=new webkitSpeechRecognition();
  r.lang="mr-IN";
  r.start();

  r.onresult=e=>{
    let text=e.results[0][0].transcript;
    addMsg(text,"user");
    process(text);

    if(step<q.length) voiceLoop();
  };
}

function endCall(){
  mode="chat";
  document.getElementById("callScreen").style.display="none";
}

/* START */
window.onload=()=>{
  addMsg("नमस्कार 👋 चला report करूया","bot");
  addMsg(q[0],"bot");
};

/* SHEET */
function sendToSheet(data){
  fetch("YOUR_GOOGLE_SCRIPT_URL",{
    method:"POST",
    body:JSON.stringify(data)
  });
}
</script>

</body>
</html>
