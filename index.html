<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Suraksha Vigil Bot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0b141a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* APP */

.app{
width:430px;
height:95vh;
background:#efeae2;
display:flex;
flex-direction:column;
overflow:hidden;
border-radius:18px;
box-shadow:0 0 30px rgba(0,0,0,.5);
position:relative;
}

/* HEADER */

.header{
background:#075e54;
color:white;
padding:10px 14px;
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
align-items:center;
}

.dp{
width:42px;
height:42px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
margin-right:10px;
font-size:22px;
}

.head-text small{
opacity:.8;
font-size:12px;
}

.helpline-btn{
display:flex;
align-items:center;
gap:6px;
background:rgba(255,255,255,.15);
padding:8px 14px;
border-radius:20px;
cursor:pointer;
font-size:14px;
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
background:#efeae2;
scroll-behavior:smooth;
}

.msg{
max-width:78%;
padding:10px 13px;
margin:5px 0;
border-radius:12px;
font-size:14px;
line-height:1.5;
animation:fade .2s ease;
word-wrap:break-word;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(5px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.bot{
background:white;
align-self:flex-start;
border-top-left-radius:0;
}

.user{
background:#d9fdd3;
align-self:flex-end;
border-top-right-radius:0;
}

.time{
font-size:10px;
color:gray;
margin-top:4px;
text-align:right;
}

/* INPUT */

.input-area{
display:flex;
padding:8px;
background:#f0f2f5;
align-items:center;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:25px;
outline:none;
font-size:14px;
background:white;
}

.send,
.mic{
width:44px;
height:44px;
border:none;
border-radius:50%;
background:#075e54;
color:white;
margin-left:6px;
font-size:18px;
cursor:pointer;
}

/* CHIPS */

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:8px 0;
}

.chip{
background:#128c7e;
color:white;
border:none;
padding:10px 15px;
border-radius:22px;
font-size:13px;
cursor:pointer;
transition:.2s;
}

.chip:hover{
transform:scale(1.04);
}

/* CALL SCREEN */

.call-screen{
position:absolute;
inset:0;
background:#075e54;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
padding:20px;
z-index:9999;
}

.call-avatar{
width:120px;
height:120px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:55px;
margin-bottom:20px;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.call-title{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

.call-info{
font-size:15px;
line-height:1.7;
max-width:320px;
opacity:.95;
}

.dialpad{
display:grid;
grid-template-columns:repeat(3,80px);
gap:15px;
margin-top:35px;
}

.dial-btn{
width:80px;
height:80px;
border-radius:50%;
border:none;
background:white;
color:#075e54;
font-size:28px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.dial-btn:hover{
transform:scale(1.05);
}

.end{
margin-top:40px;
padding:12px 30px;
border:none;
border-radius:25px;
background:red;
color:white;
font-size:16px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:500px){

.app{
width:100%;
height:100vh;
border-radius:0;
}

}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

<div class="left">

<div class="dp">🛡️</div>

<div class="head-text">
<b>Suraksha Vigil Bot</b><br>
<small>online</small>
</div>

</div>

<div class="helpline-btn" onclick="startCall()">
📞 Helpline
</div>

</div>

<!-- CHAT -->

<div class="chat" id="chat"></div>

<!-- INPUT -->

<div class="input-area">

<input 
type="text" 
id="input" 
placeholder="Type message..."
onkeypress="if(event.key==='Enter') send()"
>

<button class="send" onclick="send()">➤</button>

<button class="mic" onclick="voiceInput()">🎤</button>

</div>

<!-- CALL SCREEN -->

<div class="call-screen" id="callScreen">

<div class="call-avatar">🛡️</div>

<div class="call-title">
Suraksha Vigil Helpline
</div>

<div class="call-info" id="callInfo">
Connecting...
</div>

<div class="dialpad">

<button class="dial-btn" onclick="dialOption(1)">1</button>

<button class="dial-btn" onclick="dialOption(2)">2</button>

<button class="dial-btn" onclick="dialOption(3)">3</button>

</div>

<button class="end" onclick="endCall()">
End Call
</button>

</div>

</div>

<script>

let lang="";
let step=0;
let data={};

const chat=document.getElementById("chat");

/* QUESTIONS */

const mrQuestions=[

{q:"तुम्ही ही माहिती कोण म्हणून भरत आहात?",chips:["रुग्ण","डॉक्टर","फार्मासिस्ट","विद्यार्थी"]},

{q:"तुमचे गाव किंवा शहर कोणते? 📍"},

{q:"रुग्णाचे नाव काय आहे?"},

{q:"रुग्णाचे वय किती आहे?"},

{q:"लिंग निवडा:",chips:["पुरुष","महिला"]},

{q:"कोणत्या प्रकारचे औषध होते?",chips:["गोळी","सिरप","इंजेक्शन","क्रीम"]},

{q:"औषधाचे नाव काय होते?"},

{q:"काय त्रास झाला?",chips:["चक्कर 😵","खाज 😣","ताप 🤒","मळमळ 🤮"]},

{q:"हा त्रास कधी सुरू झाला?"},

{q:"त्रास किती गंभीर होता?",chips:["सौम्य","मध्यम","गंभीर"]},

{q:"हॉस्पिटलला जावे लागले का?",chips:["हो","नाही"]}

];

const enQuestions=[

{q:"Who are you reporting as?",chips:["Patient","Doctor","Pharmacist","Student"]},

{q:"Which city or village are you from? 📍"},

{q:"What is the patient name?"},

{q:"What is the patient age?"},

{q:"Select gender:",chips:["Male","Female"]},

{q:"What type of medicine was it?",chips:["Tablet","Syrup","Injection","Cream"]},

{q:"What was the medicine name?"},

{q:"What side effect happened?",chips:["Dizziness 😵","Itching 😣","Fever 🤒","Nausea 🤮"]},

{q:"When did it start?"},

{q:"How severe was it?",chips:["Mild","Moderate","Severe"]},

{q:"Was hospital visit needed?",chips:["Yes","No"]}

];

/* ADD MESSAGE */

function addMsg(msg,type){

let div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=
msg+
`<div class="time">${new Date().toLocaleTimeString()}</div>`;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}

/* SPEAK */

function speak(text){

speechSynthesis.cancel();

let speech=new SpeechSynthesisUtterance(text);

speech.lang=lang==="en" ? "en-US" : "mr-IN";

speech.rate=0.95;

speech.pitch=1;

speechSynthesis.speak(speech);

}

/* WELCOME */

window.onload=()=>{

addMsg(`
<b>🛡️ Welcome to Suraksha Vigil Bot</b>
<br><br>

💊 Smart ADR Reporting & Drug Safety Awareness Assistant
<br><br>

👉 कृपया भाषा निवडा / Please choose language.
<br><br>

📌 You can report medicine side effects safely through chat reporting.
`,"bot");

showLanguageButtons();

};

/* LANGUAGE BUTTONS */

function showLanguageButtons(){

let wrap=document.createElement("div");

wrap.className="chips";

let mr=document.createElement("button");

mr.className="chip";

mr.innerText="🇮🇳 मराठी";

mr.onclick=()=>{

lang="mr";

addMsg("🇮🇳 मराठी निवडली","user");

startChat();

};

let en=document.createElement("button");

en.className="chip";

en.innerText="🇬🇧 English";

en.onclick=()=>{

lang="en";

addMsg("🇬🇧 English Selected","user");

startChat();

};

wrap.appendChild(mr);

wrap.appendChild(en);

chat.appendChild(wrap);

}

/* START CHAT */

function startChat(){

step=0;

if(lang==="mr"){

addMsg(`
🙏 नमस्कार!
<br><br>

मी तुमची ADR Reporting मध्ये मदत करेन.
<br><br>

📌 कृपया खालील माहिती द्या.
`,"bot");

}

else{

addMsg(`
🙏 Hello!
<br><br>

I will help you with ADR Reporting.
<br><br>

📌 Please provide the following details.
`,"bot");

}

setTimeout(()=>{

askQuestion();

},700);

}

/* ASK QUESTION */

function askQuestion(){

let qs=lang==="mr" ? mrQuestions : enQuestions;

if(step<qs.length){

addMsg(qs[step].q,"bot");

if(qs[step].chips){

showChips(qs[step].chips);

}

}

else{

addMsg(

lang==="mr"

?

"✅ तुमचा ADR Report यशस्वीरित्या नोंदवला गेला आहे.<br><br>🙏 औषध सुरक्षिततेसाठी तुमचे योगदान महत्त्वाचे आहे."

:

"✅ Your ADR Report has been submitted successfully.<br><br>🙏 Your contribution helps improve medicine safety."

,"bot");

sendToSheet(data);

}

}

/* SHOW CHIPS */

function showChips(arr){

let wrap=document.createElement("div");

wrap.className="chips";

arr.forEach(x=>{

let b=document.createElement("button");

b.className="chip";

b.innerText=x;

b.onclick=()=>handleInput(x);

wrap.appendChild(b);

});

chat.appendChild(wrap);

}

/* HANDLE INPUT */

function handleInput(v){

addMsg(v,"user");

data["Q"+step]=v;

step++;

askQuestion();

}

/* SEND */

function send(){

let val=document.getElementById("input").value.trim();

if(!val) return;

handleInput(val);

document.getElementById("input").value="";

}

/* VOICE INPUT */

function voiceInput(){

let recog=new webkitSpeechRecognition();

recog.lang=lang==="en" ? "en-IN" : "mr-IN";

recog.start();

recog.onresult=(e)=>{

let text=e.results[0][0].transcript;

handleInput(text);

};

}

/* CALL */

function startCall(){

document.getElementById("callScreen").style.display="flex";

document.getElementById("callInfo").innerHTML=
`
📞 कृपया खालील पर्याय निवडा
<br><br>

1 - ADR म्हणजे काय
<br><br>

2 - Drug Interaction माहिती
<br><br>

3 - Project माहिती
`;

let welcome=
`
नमस्कार.

Suraksha Vigil Helpline मध्ये तुमचे स्वागत आहे.

ADR म्हणजे काय हे जाणून घेण्यासाठी 1 दाबा.

Drug Interaction माहिती साठी 2 दाबा.

Project माहिती साठी 3 दाबा.
`;

speak(welcome);

}

/* DIAL OPTIONS */

function dialOption(n){

/* OPTION 1 */

if(n==1){

let msg=
`
ADR म्हणजे Adverse Drug Reaction.

म्हणजे औषध घेतल्यानंतर होणारा अनपेक्षित दुष्परिणाम.

काही औषधांमुळे चक्कर, खाज, मळमळ किंवा allergic reaction होऊ शकतो.

प्रत्येक व्यक्तीची शरीररचना वेगळी असल्यामुळे औषधांचा परिणाम वेगळा होऊ शकतो.

ADR reporting मुळे डॉक्टर आणि आरोग्य विभागाला औषध सुरक्षिततेबद्दल माहिती मिळते.

यामुळे भविष्यातील गंभीर धोके टाळता येतात.

औषध घेतल्यानंतर त्रास झाल्यास त्वरित डॉक्टरांचा सल्ला घ्यावा.

धन्यवाद.
`;

document.getElementById("callInfo").innerHTML=
"📢 ADR Information Playing...";

speak(msg);

setTimeout(()=>{

endCall();

},55000);

}

/* OPTION 2 */

else if(n==2){

let msg=
`
Drug Drug Interaction म्हणजे दोन औषधे एकत्र घेतल्यामुळे होणारा परिणाम.

यामुळे काही वेळा औषधांचा प्रभाव वाढू शकतो किंवा कमी होऊ शकतो.

काही वेळा गंभीर दुष्परिणाम देखील होऊ शकतात.

नेहमी डॉक्टरांच्या सल्ल्यानेच औषधे घ्यावीत.

स्वतःहून औषधे घेणे टाळावे.

ADR reporting मुळे भविष्यातील धोके टाळण्यास मदत होते.

धन्यवाद.
`;

document.getElementById("callInfo").innerHTML=
"💊 Drug Interaction Information Playing...";

speak(msg);

setTimeout(()=>{

endCall();

},50000);

}

/* OPTION 3 */

else if(n==3){

let msg=
`
Suraksha Vigil हा एक आधुनिक ADR reporting project आहे.

या project साठी Doctor Bhushan Pawar Sir यांचे अमूल्य मार्गदर्शन लाभले.

त्यांच्या प्रेरणेमुळे आणि योग्य दिशेमुळे आम्ही हा bilingual chatbot आणि voice helpline आधारित ADR reporting system तयार करू शकलो.

Sir यांनी आम्हाला healthcare क्षेत्रामध्ये patient safety चे महत्त्व समजावून सांगितले.

ग्रामीण आणि शहरी भागातील लोकांना सोप्या पद्धतीने ADR reporting करता यावी हा या project चा मुख्य उद्देश आहे.

Doctor Bhushan Pawar Sir यांच्या मार्गदर्शनामुळेच हा project यशस्वीरित्या पूर्ण होऊ शकला.

धन्यवाद.
`;

document.getElementById("callInfo").innerHTML=
"🎓 Project Information Playing...";

speak(msg);

setTimeout(()=>{

endCall();

},70000);

}

}

/* END CALL */

function endCall(){

speechSynthesis.cancel();

document.getElementById("callScreen").style.display="none";

}

/* GOOGLE SHEET */

function sendToSheet(data){

fetch("https://script.google.com/macros/s/AKfycbwHdpYghnTnc0KDd8rGwldWbNvm--QZAJmhGeTFj1KyBQ0TnnXGJnnoEJFC7fYn1Z53xQ/exec",{

method:"POST",

body:JSON.stringify(data)

})

.then(()=>{

console.log("Data Sent");

})

.catch(err=>{

console.log(err);

});

}

</script>

</body>
</html>
